# Complete Expanso Edge pipeline for Splunk HEC.
# The HEC endpoint is an http_client output because splunk_hec is not shipped
# by Expanso Edge.

name: splunk-production-integration
type: pipeline
config:
  input:
    file:
      paths:
        - /var/log/app/*.log

  pipeline:
    processors:
      - mapping: |
          let raw = content().string()
          let parts = $raw.re_find_all_submatch(
            "^(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}) \\[(INFO|WARN|ERROR|DEBUG)\\] \\[([^\\]]+)\\] (.+)$"
          )
          root = if $parts.length() > 0 {
            {
              "timestamp": $parts.index(0).index(1),
              "level": $parts.index(0).index(2),
              "thread": $parts.index(0).index(3),
              "message": $parts.index(0).index(4),
              "raw": $raw
            }
          } else {
            {
              "timestamp": now(),
              "level": "INFO",
              "thread": "unknown",
              "message": $raw,
              "raw": $raw
            }
          }

      - mapping: |
          root = if this.level == "DEBUG" ||
            this.message.contains("Health check passed") {
            deleted()
          } else {
            this
          }

      - mapping: |
          root = {
            "event": this,
            "sourcetype": "app:custom",
            "index": if this.level == "ERROR" {
              "security"
            } else {
              "main"
            },
            "host": env("HOSTNAME").or("edge-node-01"),
            "source": "/var/log/app/application.log"
          }

  output:
    http_client:
      url: https://splunk.company.com:8088/services/collector/event
      verb: POST
      headers:
        Authorization: Splunk ${SPLUNK_HEC_TOKEN}
        Content-Type: application/json
      batching:
        count: 100
        period: 10s
