# DB2 to BigQuery Migration Pipeline
# Replaces DataStage ETL with edge-native processing
#
# Use case: Nightly batch migration of financial transactions from
# on-premise DB2 to Google BigQuery with DataStage-style transformations
#
# Key features:
# - SQL query against DB2 via ODBC
# - USD conversion using governed currency rates
# - Account number masking for compliance
# - Transaction categorization
# - Lineage metadata for audit trail
# - Lands in BigQuery partitioned by date

name: db2-to-bigquery-transactions
description: Migrate financial transactions from Db2 to a pre-provisioned BigQuery table

type: pipeline

config:
  input:
    # Query DB2 for yesterday's transactions
    # Runs on a schedule (see deployment config)
    sql_select:
      driver: odbc
      dsn: 'Driver={IBM DB2 ODBC Driver};Database=${DB2_DATABASE};Hostname=${DB2_HOST};Port=${DB2_TLS_PORT};Protocol=TCPIP;Uid=${DB2_USER};Pwd=${DB2_PASSWORD};Security=SSL;SSLServerCertificate=${DB2_CA_CERT};'
      table: TRANSACTIONS
      columns:
        - TRANSACTION_ID
        - ACCOUNT_NUMBER
        - CUSTOMER_ID
        - TRANSACTION_DATE
        - TRANSACTION_TYPE
        - AMOUNT
        - CURRENCY
        - MERCHANT_NAME
        - MERCHANT_CATEGORY_CODE
        - SOURCE_SYSTEM
        - CREATED_AT
      where: 'TRANSACTION_DATE >= CURRENT DATE - 1 DAY AND TRANSACTION_DATE < CURRENT DATE'
      args_mapping: ''

  pipeline:
    processors:
      # Step 1: Add lineage metadata (critical for audit)
      - mapping: |
          root = this
          root._lineage = {
            "source_system": "DB2_PROD",
            "source_table": "TRANSACTIONS",
            "pipeline": "db2-to-bigquery-transactions",
            "extracted_at": now(),
            "node_id": env("NODE_ID").or("unknown")
          }

      # Step 2: Mask account numbers for downstream handling
      # Keep last 4 digits for reconciliation, hash full number for joins
      - mapping: |
          root = this
          let account_hash_key = env("ACCOUNT_HASH_KEY").or("")
          let account_hash_key = if $account_hash_key == "" {
            throw("ACCOUNT_HASH_KEY is required")
          } else { $account_hash_key }
          root.account_number_masked = "****-****-" + this.ACCOUNT_NUMBER.slice(-4)
          root.account_number_hash = this.ACCOUNT_NUMBER.hash(
            "hmac_sha256",
            $account_hash_key
          ).encode("hex")
          root = root.without("ACCOUNT_NUMBER")

      - branch:
          request_map: |
            root.currency = this.CURRENCY
            root.rate_date = this.TRANSACTION_DATE
          processors:
            - sql_select:
                driver: odbc
                dsn: 'Driver={IBM DB2 ODBC Driver};Database=${DB2_DATABASE};Hostname=${DB2_HOST};Port=${DB2_TLS_PORT};Protocol=TCPIP;Uid=${DB2_USER};Pwd=${DB2_PASSWORD};Security=SSL;SSLServerCertificate=${DB2_CA_CERT};'
                table: CURRENCY_RATES
                columns: [USD_RATE]
                where: 'CURRENCY = ? AND RATE_DATE = ?'
                args_mapping: 'root = [this.currency, this.rate_date]'
            - mapping: |
                root = if this.length() != 1 {
                  throw("Expected one governed USD rate for the transaction date")
                } else { this.index(0) }
            - mapping: |
                root = if this.USD_RATE.type() != "number" || this.USD_RATE <= 0 {
                  throw("Invalid governed USD rate")
                } else { this }
          result_map: |
            root.original_amount = root.AMOUNT
            root.original_currency = root.CURRENCY
            root.amount_usd = (root.AMOUNT.number() * this.USD_RATE * 100).round() / 100

      # Step 4: Categorize transactions
      # DataStage replacement: Lookup table / case statement
      - mapping: |
          root = this

          # Map MCC codes to categories
          let mcc = this.MERCHANT_CATEGORY_CODE.string()

          root.transaction_category = match mcc {
            $mcc.has_prefix("54") => "GROCERY",
            $mcc.has_prefix("55") => "AUTOMOTIVE",
            $mcc.has_prefix("58") => "RESTAURANT",
            $mcc.has_prefix("59") => "RETAIL",
            $mcc.has_prefix("47") => "TRANSPORTATION",
            $mcc.has_prefix("40") || $mcc.has_prefix("41") => "TRAVEL",
            $mcc.has_prefix("60") || $mcc.has_prefix("61") => "FINANCIAL",
            $mcc.has_prefix("80") => "PROFESSIONAL_SERVICES",
            _ => "OTHER"
          }

      # Step 5: Standardize field names for BigQuery schema
      - mapping: |
          root.transaction_id = this.TRANSACTION_ID
          root.customer_id = this.CUSTOMER_ID
          root.transaction_date = this.TRANSACTION_DATE
          root.transaction_type = this.TRANSACTION_TYPE
          root.merchant_name = this.MERCHANT_NAME
          root.merchant_category_code = this.MERCHANT_CATEGORY_CODE
          root.source_system = this.SOURCE_SYSTEM
          root.created_at = this.CREATED_AT

          # Carry forward transformed fields
          root.amount_usd = this.amount_usd
          root.original_amount = this.original_amount
          root.original_currency = this.original_currency
          root.account_number_masked = this.account_number_masked
          root.account_number_hash = this.account_number_hash
          root.transaction_category = this.transaction_category
          root._lineage = this._lineage

          # Add BigQuery partition field
          root._partition_date = this.TRANSACTION_DATE

      # Step 6: Validate required fields before loading
      - mapping: |
          root = if this.transaction_id == null ||
                    this.customer_id == null ||
                    this.amount_usd == null {
            throw("Missing required field for BigQuery load")
          } else {
            this
          }

      - catch:
          - mapping: root = deleted()

  output:
    gcp_bigquery:
      project: '${GCP_PROJECT}'
      dataset: financial_data
      table: transactions
      format: NEWLINE_DELIMITED_JSON
      write_disposition: WRITE_APPEND
      # Provision this table with a DAY partition on _partition_date before use.
      batching:
        count: 1000
        period: 30s
