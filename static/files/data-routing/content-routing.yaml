name: severity-based-routing
description: Route log messages based on severity level
type: pipeline
namespace: production
labels:
  environment: production
  pattern: content-routing

config:
  input:
    http_server:
      address: 0.0.0.0:8080
      path: /logs
      timeout: 5s

  pipeline:
    processors:
      # Parse JSON input and validate
      - mapping: |
          root = if this.severity == null {
            throw("Missing required field: severity")
          } else {
            this
          }

          # Normalize severity to uppercase
          root.severity = this.severity.string().uppercase()

          # Add routing metadata
          root.routed_at = now()
          root.node_id = env("NODE_ID").or("unknown")

  output:
    switch:
      cases:
        # Case 1: Critical errors to PagerDuty
        - check: this.severity == "CRITICAL" || this.severity == "FATAL"
          output:
            # PagerDuty Events API v2 envelope. The routing key is the
            # integration credential and belongs in the request body.
            processors:
              - mapping: |
                  root.routing_key = env("PAGERDUTY_ROUTING_KEY")
                  root.event_action = "trigger"
                  root.dedup_key = this.event_id.or(uuid_v4())
                  root.payload = {
                    "summary": this.message.or("Critical error occurred"),
                    "severity": "critical",
                    "source": this.source.or("unknown"),
                    "timestamp": this.timestamp,
                    "custom_details": this
                  }
            http_client:
              url: https://events.pagerduty.com/v2/enqueue
              verb: POST
              headers:
                Content-Type: application/json
              retries: 5
              retry_period: 500ms
              max_retry_backoff: 5s

        # Case 2: Warnings to Slack
        - check: this.severity == "WARNING" || this.severity == "WARN"
          output:
            processors:
              - mapping: |
                  root.text = ":warning: " + this.message.or("Warning")
                  root.blocks = [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Severity:* " + this.severity + "\n*Source:* " + this.source.or("unknown") + "\n*Message:* " + this.message.or("N/A")
                      }
                    }
                  ]
            http_client:
              url: ${SLACK_HTTPS_WEBHOOK_URL}
              verb: POST
              headers:
                Content-Type: application/json
              retries: 3

        # Case 3: Everything else to the Elasticsearch document API
        - output:
            http_client:
              url: '${ELASTICSEARCH_HTTPS_URL}/logs-${! now().ts_format("2006-01-02") }/_doc/${! this.event_id.or(uuid_v4()) }'
              verb: PUT
              headers:
                Authorization: 'ApiKey ${ELASTICSEARCH_API_KEY}'
                Content-Type: application/json
              tls:
                enabled: true
                root_cas_file: ${ELASTICSEARCH_CA_FILE}
              retries: 3
              retry_period: 1s
              max_retry_backoff: 30s
