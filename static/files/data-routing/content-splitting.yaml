name: split-sensor-array
description: Split sensor reading arrays into individual messages
type: pipeline
namespace: production

config:
  input:
    http_server:
      address: 0.0.0.0:8080
      path: /sensors/bulk
      timeout: 5s

  pipeline:
    processors:
      # Step 1: Store parent context in metadata BEFORE splitting
      - mapping: |
          meta device_id = this.device_id
          meta batch_timestamp = this.timestamp
          root = this

      # Step 2: Validate structure
      - mapping: |
          root = if this.readings == null || this.readings.type() != "array" {
            throw("Missing or invalid readings array")
          } else {
            this.readings
          }

      # Step 3: Split the readings array into individual messages
      - unarchive:
          format: json_array

      # Step 4: Enrich each split message with parent context
      - mapping: |
          root = this
          root.device_id = meta("device_id")
          root.batch_timestamp = meta("batch_timestamp")
          root.edge_node = env("NODE_ID").or("unknown")
          root.processed_at = now()

  output:
    switch:
      cases:
        # Critical: High temperature alert
        - check: this.value > 80.0 && this.unit == "F"
          output:
            http_client:
              url: ${ALERT_SERVICE_HTTPS_URL}/critical-temp
              verb: POST
              headers:
                Content-Type: application/json
                Authorization: 'Bearer ${ALERT_SERVICE_TOKEN}'
              retries: 5
              tls:
                enabled: true

        # Warning: Elevated temperature
        - check: this.value > 70.0 && this.value <= 80.0 && this.unit == "F"
          output:
            kafka:
              addresses: ['${KAFKA_TLS_BROKERS}']
              topic: elevated-temp-warnings
              tls:
                enabled: true
                root_cas_file: ${KAFKA_CA_FILE}
              sasl:
                mechanism: SCRAM-SHA-512
                user: '${KAFKA_USERNAME}'
                password: '${KAFKA_PASSWORD}'
              batching:
                count: 50
                period: 30s

        # Normal: Archive for analytics
        - output:
            file:
              path: ${SENSOR_ARCHIVE_PATH}/normal-${!timestamp_unix_date("2006-01-02")}.jsonl
              codec: lines
