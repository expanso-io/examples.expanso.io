name: deduplicate-events
type: pipeline
config:
  input:
    broker:
      inputs:
        - http_server:
            address: ""
            path: /webhooks/signup
            allowed_verbs:
              - POST
        - http_server:
            address: ""
            path: /events
            allowed_verbs:
              - POST
  pipeline:
    processors:
      - command:
          name: uv
          args_mapping: root = ["run", "--no-project", env("RECORD_TRANSFORMS_SCRIPT"), "deduplicate"]
      - catch:
          - mapping: root = deleted()
    threads: 1
  output:
    switch:
      cases:
        - check: this.is_duplicate == false
          output:
            broker:
              pattern: fan_out
              outputs:
                - http_client:
                    url: ${ANALYTICS_HTTPS_URL}/events
                    verb: POST
                    headers:
                      Authorization: Bearer ${ANALYTICS_API_TOKEN}
                      Content-Type: application/json
                    tls:
                      enabled: true
                    retries: 3
                - kafka:
                    addresses:
                      - ${KAFKA_TLS_BROKERS}
                    topic: unique-events
                    tls:
                      enabled: true
                      root_cas_file: ${KAFKA_CA_FILE}
                    sasl:
                      mechanism: SCRAM-SHA-512
                      user: ${KAFKA_USERNAME}
                      password: ${KAFKA_PASSWORD}
        - output:
            file:
              path: ${DUPLICATE_ARCHIVE_PATH}/dupes.jsonl
              codec: lines
  http:
    enabled: true
    address: 127.0.0.1:8080
    root_path: /runtime
    debug_endpoints: false
