name: multi-format-log-parser
type: pipeline
config:
  input:
    broker:
      inputs:
        - file:
            paths:
              - ${LOG_INPUT_PATH}/*.jsonl
            codec: lines
        - http_server:
            address: 127.0.0.1:8080
            path: /logs
            allowed_verbs:
              - POST
  pipeline:
    processors:
      - command:
          name: uv
          args_mapping: root = ["run", "--no-project", env("RECORD_CODECS_SCRIPT"), "parse-log"]
      - catch:
          - mapping: 'root = {"format": "parse_failed", "parse_error": error(), "raw_content": content().string()}'
  output:
    switch:
      cases:
        - check: this.format == "unknown" || this.format == "parse_failed"
          output:
            file:
              path: ${LOG_DLQ_PATH}/unparsed.jsonl
              codec: lines
        - output:
            http_client:
              url: ${LOG_HTTPS_URL}/logs
              verb: POST
              headers:
                Authorization: Bearer ${LOG_API_TOKEN}
                Content-Type: application/json
              tls:
                enabled: true
              retries: 3
              batching:
                count: 100
                period: 5s
