name: aggregate-time-windows
type: pipeline
config:
  input:
    broker:
      inputs:
        - http_server:
            address: 127.0.0.1:8080
            path: /sensors/readings
            allowed_verbs:
              - POST
        - kafka:
            addresses:
              - ${KAFKA_TLS_BROKERS}
            tls:
              enabled: true
              root_cas_file: ${KAFKA_CA_FILE}
            sasl:
              mechanism: SCRAM-SHA-512
              user: ${KAFKA_USERNAME}
              password: ${KAFKA_PASSWORD}
            topics:
              - sensor-events
            consumer_group: time-window-aggregation-${INSTANCE_ID}
  pipeline:
    threads: 1
    processors:
      - command:
          name: uv
          args_mapping: root = ["run", "--no-project", env("RECORD_TRANSFORMS_SCRIPT"), "aggregate"]
      - catch:
          - mapping: root = deleted()
      - unarchive:
          format: json_array
  output:
    broker:
      pattern: fan_out
      outputs:
        - http_client:
            url: ${ANALYTICS_HTTPS_URL}/metrics/aggregated
            verb: POST
            headers:
              Authorization: Bearer ${ANALYTICS_API_TOKEN}
              Content-Type: application/json
            tls:
              enabled: true
            retries: 3
            batching:
              count: 50
              period: 10s
        - file:
            path: ${AGGREGATION_ARCHIVE_PATH}/aggregations.jsonl
            codec: lines
