config:
  input:
    http_server:
      address: '0.0.0.0:8080'
      path: /sensors/readings

  pipeline:
    processors:
      - mapping: root = content().parse_json()
      - group_by_value:
          value: ${! this.sensor_id }
      - mapping: |-
          let values = json("temperature").from_all()
          let end = meta("window_end_timestamp").ts_parse("2006-01-02T15:04:05Z07:00").ts_unix_nano() / 1000000000
          root = if batch_index() == 0 {
            {"sensor_id": this.sensor_id,
             "window_start": ($end - 60).ts_format("2006-01-02T15:04:05Z07:00"),
             "window_end": meta("window_end_timestamp"),
             "time_bucket": ($end - 60).ts_format("2006-01-02T15:04:05Z07:00"),
             "group_key": this.sensor_id + "|" + ($end - 60).ts_format("2006-01-02T15:04:05Z07:00"),
             "event_count": $values.length(),
             "temperature_avg": $values.sum() / $values.length(),
             "temperature_min": $values.min(), "temperature_max": $values.max()}
          } else { deleted() }

  output:
    http_client:
      url: '${ANALYTICS_ENDPOINT}/metrics/aggregated'
      verb: POST
      batching:
        count: 50
        period: 10s
  buffer:
    system_window:
      size: 1m
      timestamp_mapping: root = this.timestamp
