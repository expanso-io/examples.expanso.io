name: payment-field-encryption
description: Encrypt sensitive payment and PII data with AES-256-GCM
type: pipeline
namespace: production
labels:
  environment: production
  data-type: payments
  security: sensitive-payment-data
  encryption: enabled
priority: 200

selector:
  match_labels:
    role: payment-processor
    sensitive-data-approved: 'true'

deployment:
  strategy: rolling
  max_parallel: 1
  health_check:
    type: http
    endpoint: /ping
    interval: 30s
  auto_rollback: true

config:
  input:
    http_server:
      # A sidecar or node-local proxy terminates mTLS before forwarding here.
      address: '127.0.0.1:8080'
      path: /payments/transactions
      allowed_verbs: [POST]
      timeout: 10s
      rate_limit: '500/1s'

  pipeline:
    processors:
      # Validate input
      - mapping: |
          root = if this.transaction_id != null &&
                    this.timestamp != null &&
                    this.payment != null {
            this
          } else {
            throw("Missing required fields")
          }

      # Encrypt credit card fields (see pattern guide)
      - mapping: |
          root = this
          let key = env("CARD_ENCRYPTION_KEY_HEX").decode("hex")
          let number_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
          let name_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
          root.payment.card_number_encrypted = if this.payment.card_number != null {
            this.payment.card_number.encrypt_aes(
              "gcm", $key, $number_nonce.decode("hex")
            ).encode("base64")
          }
          root.payment.card_number_nonce = if this.payment.card_number != null {
            $number_nonce
          } else { deleted() }
          root.payment.card_last_four = if this.payment.card_number != null {
            this.payment.card_number.re_replace_all("[^0-9]", "").slice(-4)
          }
          root.payment.card_brand = if this.payment.card_number != null {
            match {
              this.payment.card_number.re_match("^4") => "visa"
              this.payment.card_number.re_match("^5[1-5]") => "mastercard"
              this.payment.card_number.re_match("^3[47]") => "amex"
              this.payment.card_number.re_match("^6(?:011|5)") => "discover"
              _ => "unknown"
            }
          }
          root.payment.cardholder_name_encrypted = if this.payment.cardholder_name != null {
            this.payment.cardholder_name.encrypt_aes(
              "gcm", $key, $name_nonce.decode("hex")
            ).encode("base64")
          }
          root.payment.cardholder_name_nonce = if this.payment.cardholder_name != null {
            $name_nonce
          } else { deleted() }
          # CVV is deleted rather than retained in any form.
          root.payment = root.payment.without("card_number", "cvv", "cardholder_name")

      # Encrypt PII fields (see pattern guide)
      - mapping: |
          root = this
          let key = env("PII_ENCRYPTION_KEY_HEX").decode("hex")
          let ssn_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
          let email_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
          let phone_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
          let birth_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
          root.customer.ssn_encrypted = if this.customer.ssn != null {
            this.customer.ssn.encrypt_aes(
              "gcm", $key, $ssn_nonce.decode("hex")
            ).encode("base64")
          }
          root.customer.ssn_nonce = if this.customer.ssn != null {
            $ssn_nonce
          } else { deleted() }
          root.customer.ssn_last_four = if this.customer.ssn != null {
            this.customer.ssn.re_replace_all("[^0-9]", "").slice(-4)
          }
          root.customer.email_encrypted = if this.customer.email != null {
            this.customer.email.encrypt_aes(
              "gcm", $key, $email_nonce.decode("hex")
            ).encode("base64")
          }
          root.customer.email_nonce = if this.customer.email != null {
            $email_nonce
          } else { deleted() }
          root.customer.email_domain = if this.customer.email != null {
            this.customer.email.split("@").index(1).lowercase()
          }
          root.customer.phone_encrypted = if this.customer.phone != null {
            this.customer.phone.encrypt_aes(
              "gcm", $key, $phone_nonce.decode("hex")
            ).encode("base64")
          }
          root.customer.phone_nonce = if this.customer.phone != null {
            $phone_nonce
          } else { deleted() }
          root.customer.phone_area_code = if this.customer.phone != null {
            this.customer.phone.re_replace_all("[^0-9]", "").slice(0, 3)
          }
          root.customer.date_of_birth_encrypted = if this.customer.date_of_birth != null {
            this.customer.date_of_birth.encrypt_aes(
              "gcm", $key, $birth_nonce.decode("hex")
            ).encode("base64")
          }
          root.customer.date_of_birth_nonce = if this.customer.date_of_birth != null {
            $birth_nonce
          } else { deleted() }
          root.customer.birth_year = if this.customer.date_of_birth != null {
            this.customer.date_of_birth.split("-").index(0).number()
          }
          root.customer = root.customer.without("ssn", "email", "phone", "date_of_birth")

      # Encrypt address fields (see pattern guide)
      - mapping: |
          root = this
          let key = env("ADDRESS_ENCRYPTION_KEY_HEX").decode("hex")
          let street_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
          let zip_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
          root.billing_address.street_encrypted = if this.billing_address.street != null {
            this.billing_address.street.encrypt_aes(
              "gcm", $key, $street_nonce.decode("hex")
            ).encode("base64")
          }
          root.billing_address.street_nonce = if this.billing_address.street != null {
            $street_nonce
          } else { deleted() }
          root.billing_address.zip_encrypted = if this.billing_address.zip != null {
            this.billing_address.zip.encrypt_aes(
              "gcm", $key, $zip_nonce.decode("hex")
            ).encode("base64")
          }
          root.billing_address.zip_nonce = if this.billing_address.zip != null {
            $zip_nonce
          } else { deleted() }
          root.billing_address = root.billing_address.without("street", "zip")

      # Add encryption metadata
      - mapping: |
          root = this
          root.encryption_metadata = {
            "encrypted": true,
            "encryption_timestamp": now(),
            "key_version": env("KEY_VERSION").or("unknown"),
            "algorithm": "AES-256-GCM",
            "node_id": env("NODE_ID").or("unknown")
          }

      # Validate no plaintext sensitive data remains
      - mapping: |
          root = this
          let sensitive_found = [
            if this.payment.card_number != null { "payment.card_number" },
            if this.payment.cvv != null { "payment.cvv" },
            if this.customer.ssn != null { "customer.ssn" },
            if this.customer.email != null { "customer.email" }
          ].filter(v -> v != null)
          root = if $sensitive_found.length() > 0 {
            throw("Encryption validation failed: " + $sensitive_found.join(", "))
          } else {
            this
          }

      - catch:
          - mapping: root = deleted()

  output:
    broker:
      pattern: fan_out
      outputs:
        - label: payment_processor
          http_client:
            url: '${PAYMENT_PROCESSOR_HTTPS_URL}/transactions'
            verb: POST
            headers:
              Content-Type: application/json
              X-Encryption-Version: '${KEY_VERSION}'
              Authorization: 'Bearer ${PAYMENT_PROCESSOR_TOKEN}'
            tls:
              enabled: true
              root_cas_file: ${PAYMENT_PROCESSOR_CA_FILE}
              client_certs:
                - cert_file: ${PAYMENT_PROCESSOR_CLIENT_CERT}
                  key_file: ${PAYMENT_PROCESSOR_CLIENT_KEY}
            batching:
              count: 50
              period: 5s
            retries: 3

        - label: analytics
          http_client:
            url: '${ANALYTICS_HTTPS_URL}/payments'
            verb: POST
            headers:
              Content-Type: application/json
              Authorization: 'Bearer ${ANALYTICS_API_TOKEN}'
            tls:
              enabled: true
              root_cas_file: ${ANALYTICS_CA_FILE}
            batching:
              count: 100
              period: 10s

logger:
  level: INFO
  format: json
  static_fields:
    pipeline: payment-field-encryption
    security_level: sensitive-payment-data

metrics:
  prometheus:
    path: /metrics
