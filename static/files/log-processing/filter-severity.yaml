name: filter-severity-complete
type: pipeline
description: Complete Log Severity Filtering Pipeline with JSON parsing, intelligent severity detection, and conditional routing.
namespace: production
labels:
  category: log-processing
  pattern: severity-filtering
config:
  input:
    file:
      paths:
        - /var/log/app/*.log
      codec: lines
  pipeline:
    processors:
      - mapping: |-
          let original = content().string()
          let parsed = content().parse_json().catch(null)
          let structured = $original.re_find_object("^(?P<timestamp>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}) \\[(?P<level>[A-Z]+)\\] (?P<message>.+)$").catch({})
          root = if $parsed != null { $parsed } else if $structured.timestamp != null { $structured } else { {"original_message":$original,"level":"UNKNOWN"} }
          root.original_format = if $parsed != null { "json" } else if $structured.timestamp != null { "structured_text" } else { "unstructured_text" }
          root.parsing_success = $parsed != null || $structured.timestamp != null
      - mapping: |
          root = this
          root.processing_metadata = {
            "processed_at": now(),
            "node_id": env("NODE_ID").or("unknown"),
            "pipeline_version": env("PIPELINE_VERSION").or("1.0")
          }
      - mapping: |-
          root = this
          let original = this.level.or("UNKNOWN").string().uppercase()
          let text = this.message.or("").string().lowercase() + this.original_message.or("").string().lowercase()
          let inferred = if $original == "UNKNOWN" {
            if ["error", "fail", "exception", "crash", "critical", "fatal"].any(k -> $text.contains(k)) { "ERROR" }
            else if ["warn", "warning", "alert", "caution", "timeout"].any(k -> $text.contains(k)) { "WARN" }
            else { $original }
          } else { $original }
          root.level = {"FATAL":"ERROR", "SEVERE":"ERROR", "CRITICAL":"ERROR", "WARNING":"WARN"}.get($inferred).or($inferred)
          root.original_level = $original
      - mapping: |-
          root = if this.level == "ERROR" || this.level == "WARN" { this } else { deleted() }
          root.filter_metadata = if this.level == "ERROR" || this.level == "WARN" { {"passed_filter": true, "filter_reason":"severity_match", "filtering_timestamp": now()} } else { deleted() }
  output:
    broker:
      pattern: fan_out
      outputs:
        - switch:
            cases:
              - check: this.level == "ERROR"
                output:
                  file:
                    path: ${LOG_OUTPUT_PATH}/errors/${! timestamp_unix_date() }.json
                    codec: lines
              - check: this.level == "WARN"
                output:
                  stdout:
                    codec: lines
              - output:
                  file:
                    path: ${LOG_OUTPUT_PATH}/unrouted-logs.json
                    codec: lines
        - http_client:
            url: '${ELASTICSEARCH_HTTPS_URL}/filtered-logs-${! now().ts_format("2006-01-02") }/_doc/${! uuid_v4() }'
            verb: PUT
            headers:
              Authorization: 'ApiKey ${ELASTICSEARCH_API_KEY}'
              Content-Type: application/json
            tls:
              enabled: true
              root_cas_file: ${ELASTICSEARCH_CA_FILE}
            retries: 3
            retry_period: 1s
            max_retry_backoff: 30s
logger:
  level: INFO
  format: json
metrics:
  prometheus:
    path: /metrics
