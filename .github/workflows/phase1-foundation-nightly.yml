name: Phase 1 Foundation Nightly

# Nightly home for the browser-heavy Phase 1 jobs (visual regression +
# browser accessibility shards). These validate exactly the same checks as
# before; they just no longer run on every push/PR, which was the dominant
# source of Actions minute burn. The per-PR/per-push pipeline lives in
# phase1-foundation.yml (path-filtered).

on:
  schedule:
    # Nightly sweep at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-1-foundation-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.2
  CONTENT_ENFORCEMENT_STAGE: foundation

jobs:
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Require checked-in visual baselines
        run: npm run quality:visual

      - name: Reject generated or updated baseline files
        if: always()
        run: |
          set -euo pipefail
          CHANGES=$(git status --porcelain --untracked-files=all -- \
            'tests/quality/visual-regression/visual-regression.spec.ts-snapshots')
          if [ -n "$CHANGES" ]; then
            echo "Playwright changed visual baselines; baseline candidates must be reviewed and checked in separately."
            echo "$CHANGES"
            exit 1
          fi

      - name: Record visual regression PASS
        run: |
          node --input-type=module - <<'NODE'
          import { mkdirSync, readdirSync, writeFileSync } from 'node:fs';
          const snapshotRoot = 'tests/quality/visual-regression/visual-regression.spec.ts-snapshots';
          const result = {
            resultVersion: 'visual-regression-result-v1',
            status: 'PASS',
            subjectSha: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            snapshotCount: readdirSync(snapshotRoot).filter((name) => name.endsWith('.png')).length,
          };
          mkdirSync('test-results/quality/visual-regression', { recursive: true });
          writeFileSync(
            'test-results/quality/visual-regression/visual-regression-result-v1.json',
            `${JSON.stringify(result, null, 2)}\n`
          );
          NODE

      - name: Upload visual regression PASS result
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-result-${{ github.sha }}
          path: test-results/quality/visual-regression/visual-regression-result-v1.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload visual-regression evidence and candidate captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-evidence-${{ github.sha }}
          path: |
            test-results/quality
            tests/quality/visual-regression/visual-regression.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 14

  browser-accessibility-shard:
    name: Browser Accessibility Shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate accessibility contract schema and digest
        run: npm run quality:contracts

      - name: Install pinned Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Build the exact test-only accessibility inventory
        env:
          EXPLORER_RUNTIME_HARNESS: '1'
        run: npm run build

      - name: Produce deterministic accessibility shard
        env:
          QUALITY_SUBJECT_SHA: ${{ github.sha }}
          QUALITY_ENVIRONMENT_ID: github-actions-linux-x64
          QUALITY_SKIP_BUILD: '1'
          QUALITY_ACCESSIBILITY_WORKERS: '3'
          QUALITY_ACCESSIBILITY_SHARD_INDEX: ${{ matrix.shard }}
          QUALITY_ACCESSIBILITY_SHARD_TOTAL: '4'
          QUALITY_ACCESSIBILITY_OUTPUT_ROOT: test-results/quality/accessibility-shard
        run: npm run quality:accessibility

      - name: Upload exact accessibility shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-accessibility-shard-${{ github.sha }}-${{ matrix.shard }}
          path: test-results/quality/accessibility-shard
          if-no-files-found: error
          retention-days: 14

  browser-accessibility:
    name: Browser Accessibility
    needs:
      - browser-accessibility-shard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate accessibility contract schema and digest
        run: npm run quality:contracts

      - name: Build the exact route inventory
        run: npm run build

      - name: Run accessibility reducer and shard-merger negative tests
        run: npm run test-quality-reducers

      - name: Build the test-only accessibility inventory
        env:
          EXPLORER_RUNTIME_HARNESS: '1'
        run: npm run build

      - name: Download accessibility shard 1
        uses: actions/download-artifact@v4
        with:
          name: browser-accessibility-shard-${{ github.sha }}-1
          path: test-results/accessibility-shards/1

      - name: Download accessibility shard 2
        uses: actions/download-artifact@v4
        with:
          name: browser-accessibility-shard-${{ github.sha }}-2
          path: test-results/accessibility-shards/2

      - name: Download accessibility shard 3
        uses: actions/download-artifact@v4
        with:
          name: browser-accessibility-shard-${{ github.sha }}-3
          path: test-results/accessibility-shards/3

      - name: Download accessibility shard 4
        uses: actions/download-artifact@v4
        with:
          name: browser-accessibility-shard-${{ github.sha }}-4
          path: test-results/accessibility-shards/4

      - name: Merge shards and reduce the full accessibility inventory
        env:
          QUALITY_SUBJECT_SHA: ${{ github.sha }}
          QUALITY_ENVIRONMENT_ID: github-actions-linux-x64
        run: |
          set -euo pipefail
          npm run quality:accessibility:merge -- \
            --input-root test-results/accessibility-shards \
            --output test-results/quality/accessibility/playwright-observations.json \
            --subject-sha "$GITHUB_SHA" \
            --environment-id github-actions-linux-x64 \
            --shard-total 4
          npm run quality:accessibility:result -- \
            --observations test-results/quality/accessibility/playwright-observations.json \
            --subject-sha "$GITHUB_SHA" \
            --environment-id github-actions-linux-x64 \
            --evidence-root test-results/quality/accessibility \
            --output test-results/quality/accessibility/accessibility-result.json
          ./node_modules/.bin/tsx scripts/quality/reduce-accessibility.ts \
            --input test-results/quality/accessibility/accessibility-result.json \
            --subject-sha "$GITHUB_SHA" \
            --environment-id github-actions-linux-x64 \
            --evidence-root test-results/quality/accessibility \
            > test-results/quality/accessibility/accessibility-reduction.json

      - name: Upload canonical accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-accessibility-evidence-${{ github.sha }}
          path: test-results/quality/accessibility
          if-no-files-found: error
          retention-days: 14
