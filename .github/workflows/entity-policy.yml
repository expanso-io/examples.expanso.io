name: Entity Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan repository materials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install document scanner dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Build public artifact
        run: npm ci && npm run build
      - name: Enforce zero current legacy-entity references in source and build
        run: uv run scripts/scan_public_materials.py --root . --policy PUBLIC-MATERIAL-SCAN.json
