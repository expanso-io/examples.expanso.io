name: Live Pipeline Links

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check published pipeline URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: ./node_modules/.bin/tsx scripts/validation/verify-live-pages.ts
