name: Nightly Expanso Edge Drift

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-expanso-edge-drift
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.2
  DRIFT_LABEL: edge-latest-drift

jobs:
  validate:
    name: Validate latest Expanso Edge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install latest Expanso Edge and CLI
        id: install
        continue-on-error: true
        env:
          EXPANSO_DISABLEANALYTICS: 'true'
          EXPANSO_INSTALL_DIR: ${{ runner.temp }}/expanso-bin
          USE_SUDO: 'false'
        run: |
          set -euo pipefail
          mkdir -p "$EXPANSO_INSTALL_DIR"
          for component in edge cli; do
            installer="${RUNNER_TEMP}/install-expanso-${component}.sh"
            curl --fail --location --silent --show-error \
              "https://get.expanso.io/${component}/install.sh" \
              --output "$installer"
            bash "$installer"
          done 2>&1 | tee install.log
          echo "$EXPANSO_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Validate and run every example with latest Expanso Edge
        id: validation
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          EXPANSO_DISABLEANALYTICS: 'true'
        run: |
          set -o pipefail
          npm run validate-examples -- --no-write 2>&1 | tee validation.log

      - name: Read installed Expanso versions
        id: versions
        if: always()
        env:
          EXPANSO_INSTALL_DIR: ${{ runner.temp }}/expanso-bin
        run: |
          edge=unavailable
          cli=unavailable
          if [ -x "$EXPANSO_INSTALL_DIR/expanso-edge" ]; then
            edge=$("$EXPANSO_INSTALL_DIR/expanso-edge" version |
              sed -nE 's/.*(v[0-9]+\.[0-9]+\.[0-9]+[^ ]*).*/\1/p' |
              head -1)
          fi
          if [ -x "$EXPANSO_INSTALL_DIR/expanso-cli" ]; then
            cli=$("$EXPANSO_INSTALL_DIR/expanso-cli" version |
              sed -nE 's/.*(v[0-9]+\.[0-9]+\.[0-9]+[^ ]*).*/\1/p' |
              head -1)
          fi
          echo "edge=${edge:-unavailable}" >> "$GITHUB_OUTPUT"
          echo "cli=${cli:-unavailable}" >> "$GITHUB_OUTPUT"

      - name: Open or update the latest-release drift issue
        if: >-
          steps.install.outcome == 'failure' ||
          steps.validation.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          EDGE_VERSION: ${{ steps.versions.outputs.edge }}
          CLI_VERSION: ${{ steps.versions.outputs.cli }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const label = process.env.DRIFT_LABEL;
            try {
              await github.rest.issues.getLabel({owner, repo, name: label});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'B60205',
                description: 'Latest Expanso release breaks a published example',
              });
            }
            const {data: issues} = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const readLog = (path) =>
              fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(not run)';
            const failures = [];
            if (process.env.INSTALL_OUTCOME === 'failure') failures.push('latest installer');
            if (process.env.VALIDATION_OUTCOME === 'failure') failures.push('full validation and execution');
            const body = [
              `Latest-release nightly failure: ${failures.join(', ')}.`,
              '',
              `- expanso-edge: \`${process.env.EDGE_VERSION}\``,
              `- expanso-cli: \`${process.env.CLI_VERSION}\``,
              `- Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              '<details><summary>Installer output</summary>',
              '',
              '```text',
              readLog('install.log').slice(-25000),
              '```',
              '</details>',
              '',
              '<details><summary>Validation output</summary>',
              '',
              '```text',
              readLog('validation.log').slice(-50000),
              '```',
              '</details>',
            ].join('\n');
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Latest Expanso Edge validation drift',
                body,
                labels: [label],
              });
            } else {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issues[0].number,
                title: 'Latest Expanso Edge validation drift',
                body,
              });
              for (const duplicate of issues.slice(1)) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: duplicate.number,
                  state: 'closed',
                  state_reason: 'not_planned',
                });
              }
            }

      - name: Close the resolved drift issue
        if: >-
          steps.install.outcome == 'success' &&
          steps.validation.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: issues} = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: process.env.DRIFT_LABEL,
              per_page: 100,
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Resolved by green latest-release validation: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail after recording latest-release drift
        if: >-
          steps.install.outcome == 'failure' ||
          steps.validation.outcome == 'failure'
        run: exit 1
