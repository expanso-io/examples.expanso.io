name: filter-severity-complete
type: pipeline
description: Complete Log Severity Filtering Pipeline with JSON parsing, intelligent severity detection, and conditional routing.
namespace: production
labels:
  category: log-processing
  pattern: severity-filtering

config:
  input:
    file:
      paths:
        - /var/log/app/*.log
      codec: lines

  pipeline:
    processors:
      # Stage 1: JSON Parsing with Fallback
      - mapping: |
          let original = content().string()
          let parsed = $original.parse_json().catch(null)
          let log_match = $original.re_find_all_submatch("(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}) \\[([A-Z]+)\\] (.+)")

          root = if $parsed.type() == "object" {
            $parsed.merge({"original_format": "json", "parsing_success": true})
          } else if $log_match.length() > 0 {
            {
              "timestamp": $log_match.index(0).index(1),
              "level": $log_match.index(0).index(2),
              "message": $log_match.index(0).index(3),
              "original_format": "structured_text",
              "parsing_success": true
            }
          } else {
            {
              "original_message": $original,
              "level": "UNKNOWN",
              "original_format": "unstructured_text",
              "parsing_success": false
            }
          }

      # Stage 2: Processing Metadata
      - mapping: |
          root = this
          root.processing_metadata = {
            "processed_at": now(),
            "node_id": env("NODE_ID").or("unknown"),
            "pipeline_version": env("PIPELINE_VERSION").or("1.0")
          }

      # Stage 3: Severity Detection and Normalization
      - mapping: |
          root = this
          let log_level = this.level.or("UNKNOWN").string().uppercase()
          let content_lower = (this.message.or("").string() + " " + this.original_message.or("").string()).lowercase()

          let error_keywords = ["error", "fail", "exception", "crash", "critical", "fatal"]
          let warn_keywords = ["warn", "warning", "alert", "caution", "timeout"]

          let detected_level = if $log_level != "UNKNOWN" {
            $log_level
          } else if $error_keywords.any(keyword -> $content_lower.contains(keyword)) {
            "ERROR"
          } else if $warn_keywords.any(keyword -> $content_lower.contains(keyword)) {
            "WARN"
          } else {
            "UNKNOWN"
          }

          let level_mappings = {
            "FATAL": "ERROR",
            "SEVERE": "ERROR",
            "CRITICAL": "ERROR",
            "WARNING": "WARN"
          }

          root.level = $level_mappings.get($detected_level).or($detected_level)
          root.original_level = $log_level

      # Stage 4: Severity-Based Filtering
      - mapping: |
          let level = this.level.string().uppercase()

          root = if $level == "ERROR" || $level == "WARN" {
            this.merge({
              "filter_metadata": {
                "passed_filter": true,
                "filter_reason": "severity_match",
                "filtering_timestamp": now()
              }
            })
          } else {
            deleted()
          }

  output:
    broker:
      pattern: fan_out
      outputs:
        - switch:
            cases:
              - check: this.level == "ERROR"
                output:
                  file:
                    path: /var/log/expanso/errors/${!timestamp_unix_date()}.json
                    codec: lines

              - check: this.level == "WARN"
                output:
                  stdout:
                    codec: lines

              - output:
                  file:
                    path: /var/log/expanso/unrouted-logs.json
                    codec: lines

logger:
  level: INFO
  format: json

metrics:
  prometheus:
    path: /metrics
