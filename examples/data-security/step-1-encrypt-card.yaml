pipeline:
  processors:
    - mapping: |
        root = this
        let key = env("CARD_KEY").or(throw("CARD_KEY is not set"))
        let card_iv = uuid_v4().hash("sha256").slice(0, 12)
        let cvv_iv = uuid_v4().hash("sha256").slice(0, 12)
        let name_iv = uuid_v4().hash("sha256").slice(0, 12)
        root.payment.card_number_nonce = $card_iv.encode("base64")
        root.payment.card_number_encrypted = this.payment.card_number.string().encrypt_aes("gcm", $key, $card_iv).encode("base64")
        root.payment.cvv_nonce = $cvv_iv.encode("base64")
        root.payment.cvv_encrypted = this.payment.cvv.string().encrypt_aes("gcm", $key, $cvv_iv).encode("base64")
        root.payment.cardholder_name_nonce = $name_iv.encode("base64")
        root.payment.cardholder_name_encrypted = this.payment.cardholder_name.string().encrypt_aes("gcm", $key, $name_iv).encode("base64")
        root.payment.card_last_four = this.payment.card_number.re_replace_all("[^0-9]", "").slice(-4)
        root.payment.card_brand = match {
          this.payment.card_number.has_prefix("4") => "visa",
          this.payment.card_number.has_prefix("5") => "mastercard",
          _ => "unknown"
        }
        root.payment = root.payment.without("card_number", "cvv", "cardholder_name")
    - catch:
        - mapping: root = deleted()
