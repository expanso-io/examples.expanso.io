name: sensor-schema-validation
description: Validate sensor data against JSON Schema with DLQ for failures
type: pipeline
namespace: production
labels:
  environment: production
  data-type: sensor-readings
  validation: enabled
priority: 100
selector:
  match_labels:
    role: sensor-collector
    validation: required
deployment:
  strategy: rolling
  max_parallel: 2
  health_check:
    type: http
    endpoint: /ping
    interval: 30s
  auto_rollback: true
config:
  input:
    broker:
      inputs:
        - http_server:
            address: ""
            path: /sensor/readings
            allowed_verbs: &a1
              - POST
            timeout: 5s
            rate_limit: sensor_ingest
        - http_server:
            address: ""
            path: /sensors
            allowed_verbs: *a1
            timeout: 5s
            rate_limit: sensor_ingest
  pipeline:
    processors:
      - mapping: root = content().parse_json()
      - mapping: |
          root = this

          # Track when message entered pipeline
          root.pipeline_metadata = {
            "received_at": now(),
            "node_id": env("NODE_ID").or("unknown"),
            "pipeline_version": "1.0.0"
          }
      - try:
          - json_schema:
              schema_path: file:///etc/expanso/schemas/sensor-schema-v1.0.0.json
          - mapping: |
              root = this
              root.validation = {
                "status": "passed",
                "schema_version": "1.0.0",
                "validated_at": now()
              }

              # Set metadata for routing
              meta validation_status = "passed"
      - catch:
          - mapping: |
              root = this

              # Capture validation failure details
              root.validation = {
                "status": "failed",
                "schema_version": "1.0.0",
                "validated_at": now(),
                "error": error(),
                "error_type": "schema_validation_failed"
              }

              # Set metadata for routing to DLQ
              meta validation_status = "failed"
              meta validation_error = error()
      - mapping: |
          root = this

          # Create data quality score
          root.data_quality = {
            "validated": true,
            "validation_passed": meta("validation_status") == "passed",
            "quality_score": if meta("validation_status") == "passed" { 100 } else { 0 }
          }
  output:
    broker:
      pattern: fan_out
      outputs:
        - label: analytics
          switch:
            cases:
              - check: meta("validation_status") == "passed"
                output:
                  http_client:
                    url: ${ANALYTICS_HTTPS_URL}/ingest
                    verb: POST
                    headers:
                      Content-Type: application/json
                      Authorization: Bearer ${ANALYTICS_API_TOKEN}
                    batching:
                      count: 100
                      period: 5s
                    tls:
                      enabled: true
                    retries: 3
                    retry_period: 1s
                    max_retry_backoff: 30s
              - output:
                  drop: {}
        - label: dead_letter_queue
          switch:
            cases:
              - check: meta("validation_status") == "failed"
                output:
                  file:
                    path: ${SCHEMA_DLQ_PATH}/schema-validation-${! timestamp_unix() }.jsonl
                    codec: lines
              - output:
                  drop: {}
        - label: metrics
          processors:
            - mapping: |
                let validation_error = meta("validation_error")
                root = {
                  "timestamp": now(),
                  "node_id": env("NODE_ID").or("unknown"),
                  "validation_status": meta("validation_status"),
                  "sensor_id": this.sensor_id.or("unknown"),
                  "error": if meta("validation_status") == "failed" {
                    $validation_error
                  }
                }
          http_client:
            url: ${METRICS_HTTPS_URL}/validation
            verb: POST
            headers:
              Content-Type: application/json
              Authorization: Bearer ${METRICS_API_TOKEN}
            batching:
              count: 100
              period: 10s
            tls:
              enabled: true
            retries: 0
  http:
    enabled: true
    address: 0.0.0.0:8080
    root_path: /runtime
    debug_endpoints: false
  rate_limit_resources:
    - label: sensor_ingest
      local:
        count: 1000
        interval: 1s
logger:
  level: INFO
  format: json
  add_timestamp: true
metrics:
  prometheus:
    path: /metrics
  mapping: |
    root = this
    meta pipeline = "schema-validation"
    meta validation = "enabled"
