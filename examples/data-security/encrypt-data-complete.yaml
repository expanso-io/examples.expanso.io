name: encrypt-data-complete
type: pipeline
description: Complete Field Encryption Pipeline - Encrypts payment, PII, and address data while preserving analytics-safe fields.
namespace: production
labels:
  category: data-security
  pattern: field-encryption

config:
  input:
    http_server:
      address: '0.0.0.0:8080'
      path: /transactions
      allowed_verbs: ['POST']

  pipeline:
    processors:
      # Step 1: Encrypt payment card data (PCI-DSS)
      # Keys come from the environment; a per-message nonce travels with the ciphertext.
      - mapping: |
          root = this

          let p = this.payment
          let key = env("CARD_KEY").or(throw("CARD_KEY is not set"))
          let card_number_iv = uuid_v4().hash("sha256").slice(0, 12)
          let cvv_iv = uuid_v4().hash("sha256").slice(0, 12)
          let cardholder_name_iv = uuid_v4().hash("sha256").slice(0, 12)
          let clean_card = $p.card_number.or("").string().re_replace_all("[^0-9]", "")

          root.payment = if this.exists("payment") {
            {
              "card_number_nonce": $card_number_iv.encode("base64"),
              "card_number_encrypted": $p.card_number.string().encrypt_aes("gcm", $key, $card_number_iv).encode("base64"),
              "card_last_four": $clean_card.slice(-4),
              "card_brand": match {
                $clean_card.has_prefix("4") => "visa",
                $clean_card.re_match("^5[1-5]") => "mastercard",
                $clean_card.re_match("^3[47]") => "amex",
                _ => "other"
              },
              "cvv_nonce": $cvv_iv.encode("base64"),
              "cvv_encrypted": $p.cvv.string().encrypt_aes("gcm", $key, $cvv_iv).encode("base64"),
              "cardholder_nonce": $cardholder_name_iv.encode("base64"),
              "cardholder_encrypted": $p.cardholder_name.string().encrypt_aes("gcm", $key, $cardholder_name_iv).encode("base64"),
              "expiration": $p.expiration
            }
          } else { deleted() }

      # Step 2: Encrypt customer PII (GDPR/CCPA)
      - mapping: |
          root = this

          let c = this.customer
          let key = env("PII_KEY").or(throw("PII_KEY is not set"))
          let ssn_iv = uuid_v4().hash("sha256").slice(0, 12)
          let email_iv = uuid_v4().hash("sha256").slice(0, 12)
          let phone_iv = uuid_v4().hash("sha256").slice(0, 12)

          root.customer = if this.exists("customer") {
            {
              "ssn_nonce": $ssn_iv.encode("base64"),
              "ssn_encrypted": $c.ssn.string().encrypt_aes("gcm", $key, $ssn_iv).encode("base64"),
              "ssn_last_four": $c.ssn.string().re_replace_all("[^0-9]", "").slice(-4),
              "email_nonce": $email_iv.encode("base64"),
              "email_encrypted": $c.email.string().encrypt_aes("gcm", $key, $email_iv).encode("base64"),
              "email_domain": $c.email.string().split("@").index(1),
              "phone_nonce": $phone_iv.encode("base64"),
              "phone_encrypted": $c.phone.string().encrypt_aes("gcm", $key, $phone_iv).encode("base64"),
              "phone_area_code": $c.phone.string().re_replace_all("[^0-9]", "").slice(0, 3)
            }
          } else { deleted() }

      # Step 3: Encrypt address data
      - mapping: |
          root = this

          let a = this.address
          let key = env("ADDR_KEY").or(throw("ADDR_KEY is not set"))
          let street_iv = uuid_v4().hash("sha256").slice(0, 12)
          let zip_iv = uuid_v4().hash("sha256").slice(0, 12)

          root.address = if this.exists("address") {
            {
              "street_nonce": $street_iv.encode("base64"),
              "street_encrypted": $a.street.string().encrypt_aes("gcm", $key, $street_iv).encode("base64"),
              "zip_nonce": $zip_iv.encode("base64"),
              "zip_encrypted": $a.zip.string().encrypt_aes("gcm", $key, $zip_iv).encode("base64"),
              "zip_prefix": $a.zip.string().slice(0, 3),
              "city": $a.city,
              "state": $a.state,
              "country": $a.country.or("US")
            }
          } else { deleted() }

      # Step 4: Add encryption metadata
      - mapping: |
          root = this
          root.encryption_metadata = {
            "encrypted": true,
            "timestamp": now(),
            "algorithm": "AES-256-GCM",
            "key_version": env("KEY_VERSION").or("v1"),
            "pipeline": "field-encryption"
          }

  output:
    stdout: {}

logger:
  level: INFO
  format: json

metrics:
  prometheus:
    path: /metrics
