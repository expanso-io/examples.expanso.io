pipeline:
  processors:
    - mapping: |
        let key = env("TEMPORAL_ENCRYPTION_KEY_HEX").decode("hex")
        let key = if $key.length() != 32 { throw("Expected a 32-byte AES key") } else { $key }
        root = this

        # Parse birth date for analytics extraction
        let birth_date = if this.customer.date_of_birth != null {
          this.customer.date_of_birth.ts_parse("2006-01-02")
        } else { null }

        # Extract temporal analytics before encryption
        root.customer.birth_year = if $birth_date != null {
          $birth_date.ts_format("2006").number()
        }
        root.customer.current_age = if root.customer.birth_year != null {
          now().ts_format("2006").number() - root.customer.birth_year
        }

        # Generate age range for demographic analytics
        root.customer.age_range = if root.customer.current_age != null {
          match {
            root.customer.current_age < 18 => "under_18"
            root.customer.current_age < 35 => "18_to_34"
            root.customer.current_age < 55 => "35_to_54"
            root.customer.current_age < 65 => "55_to_64"
            _ => "65_plus"
          }
        } else { deleted() }

        # Generate generational cohort
        root.customer.birth_decade = if root.customer.birth_year != null {
          match {
            root.customer.birth_year >= 1980 && root.customer.birth_year < 1990 => "1980s"
            root.customer.birth_year >= 1990 && root.customer.birth_year < 2000 => "1990s"
            root.customer.birth_year >= 2000 => "2000s"
            _ => "pre_1980"
          }
        }

        # Extract birth season
        let month = if $birth_date != null { $birth_date.ts_format("01").number() } else { null }
        root.customer.birth_season = if $month != null {
          match {
            $month >= 3 && $month <= 5 => "spring"
            $month >= 6 && $month <= 8 => "summer"
            $month >= 9 && $month <= 11 => "autumn"
            _ => "winter"
          }
        }

        # Encrypt exact birth date (HIPAA requirement)
        let customer_date_of_birth_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
        root.customer.date_of_birth_encrypted = if this.customer.date_of_birth != null {
          this.customer.date_of_birth.encrypt_aes("gcm", $key, $customer_date_of_birth_nonce.decode("hex")).encode("base64")
        }
        root.customer.date_of_birth_nonce = if this.customer.date_of_birth != null { $customer_date_of_birth_nonce } else { deleted() }

        # Remove plaintext birth date
        root.customer.date_of_birth = deleted()
    - catch:
        - mapping: root = deleted()
