pipeline:
  processors:
    - mapping: |
        root = this
        root.priority = if this.priority.exists() {
          this.priority
        } else if this.severity == "CRITICAL" {
          "critical"
        } else if this.user_tier == "premium" {
          "high"
        } else {
          "normal"
        }
output:
  switch:
    cases:
      - check: this.priority == "critical"
        output:
          kafka:
            topic: critical-queue
            batching:
              count: 1
              period: 0s
            addresses:
              - ${KAFKA_TLS_BROKERS}
            tls:
              enabled: true
              root_cas_file: ${KAFKA_CA_FILE}
            sasl:
              mechanism: SCRAM-SHA-512
              user: ${KAFKA_USERNAME}
              password: ${KAFKA_PASSWORD}
      - check: this.priority == "high"
        output:
          kafka:
            topic: high-priority-queue
            batching:
              count: 10
              period: 1s
            addresses:
              - ${KAFKA_TLS_BROKERS}
            tls:
              enabled: true
              root_cas_file: ${KAFKA_CA_FILE}
            sasl:
              mechanism: SCRAM-SHA-512
              user: ${KAFKA_USERNAME}
              password: ${KAFKA_PASSWORD}
      - check: this.priority == "low"
        output:
          kafka:
            topic: low-priority-queue
            batching:
              count: 1000
              period: 1m
            addresses:
              - ${KAFKA_TLS_BROKERS}
            tls:
              enabled: true
              root_cas_file: ${KAFKA_CA_FILE}
            sasl:
              mechanism: SCRAM-SHA-512
              user: ${KAFKA_USERNAME}
              password: ${KAFKA_PASSWORD}
