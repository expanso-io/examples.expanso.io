input:
  http_server:
    address: 0.0.0.0:8080
    path: /events
output:
  kafka:
    addresses:
      - ${KAFKA_TLS_BROKERS}
    topic: general-events
    tls:
      enabled: true
      root_cas_file: ${KAFKA_CA_FILE}
    sasl:
      mechanism: SCRAM-SHA-512
      user: ${KAFKA_USERNAME}
      password: ${KAFKA_PASSWORD}
