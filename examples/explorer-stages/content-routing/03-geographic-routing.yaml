output:
  switch:
    cases:
      - check: this.region == "eu-west"
        output:
          broker:
            pattern: fan_out
            outputs:
              - kafka:
                  addresses:
                    - ${KAFKA_TLS_BROKERS_EU_WEST}
                  tls:
                    enabled: true
                    root_cas_file: ${KAFKA_CA_FILE}
                  sasl:
                    mechanism: SCRAM-SHA-512
                    user: ${KAFKA_USERNAME}
                    password: ${KAFKA_PASSWORD}
                  topic: ${KAFKA_TOPIC}
              - aws_s3:
                  bucket: ${S3_BUCKET_EU_WEST}
                  region: ${AWS_REGION_EU_WEST}
                  server_side_encryption: aws:kms
                  kms_key_id: ${S3_KMS_KEY_ARN_EU_WEST}
      - check: this.region == "us-east"
        output:
          kafka:
            addresses:
              - ${KAFKA_TLS_BROKERS_US_EAST}
            tls:
              enabled: true
              root_cas_file: ${KAFKA_CA_FILE}
            sasl:
              mechanism: SCRAM-SHA-512
              user: ${KAFKA_USERNAME}
              password: ${KAFKA_PASSWORD}
            topic: ${KAFKA_TOPIC}
