output:
  broker:
    pattern: fan_out
    outputs:
      - switch:
          - check: this.priority >= 7
            output:
              http_client:
                url: ${ELASTICSEARCH_HTTPS_URL}/logs-critical/_doc/${! this.event_id.or(uuid_v4()) }
                verb: PUT
                headers:
                  Authorization: ApiKey ${ELASTICSEARCH_API_KEY}
                  Content-Type: application/json
                tls:
                  enabled: true
                  root_cas_file: ${ELASTICSEARCH_CA_FILE}
      - kafka:
          addresses:
            - ${KAFKA_TLS_BROKERS}
          topic: logs-stream
          tls:
            enabled: true
            root_cas_file: ${KAFKA_CA_FILE}
          sasl:
            mechanism: SCRAM-SHA-512
            user: ${KAFKA_USERNAME}
            password: ${KAFKA_PASSWORD}
      - aws_s3:
          bucket: ${S3_BUCKET}
          path: ${!now().ts_unix()}.json
          region: ${AWS_REGION}
          server_side_encryption: aws:kms
          kms_key_id: ${S3_KMS_KEY_ARN}
