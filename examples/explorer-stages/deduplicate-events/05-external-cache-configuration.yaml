# Production distributed configuration
cache_resources:
  - label: distributed_cache
    redis:
      url: "redis://redis-node-1:6379"
      default_ttl: "1h"

  - label: local_fallback_cache
    memory:
      default_ttl: "5m"

http:
  address: "0.0.0.0:9090"
  enabled: true
  path: "/metrics"

pipeline:
  processors:
    # Auto-strategy selection
    - mapping: |
        root = this
        root.dedup_strategy = if this.event_id.re_match("^[0-9a-fA-F-]{36}$") {
          "id-based"
        } else if ["user_signup", "purchase"].contains(this.event_type) {
          "fingerprint-based"
        } else {
          "hash-based"
        }

    # Circuit breaker with fallback
    - branch:
        request_map: |
          root = if env("CIRCUIT_STATE") == "closed" {
            this
          } else {
            deleted()  # Use local cache
          }
        processors:
          - cache:
              resource: distributed_cache
              operator: get
              key: ${! this.dedup_key }
