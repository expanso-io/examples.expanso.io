output:
  http_client:
    url: https://${SPLUNK_HOST}:${SPLUNK_PORT}/services/collector/event
    verb: POST
    headers:
      Authorization: Splunk ${SPLUNK_HEC_TOKEN}
      Content-Type: application/json
    batching:
      count: 100
      period: 10s
    tls:
      enabled: true
      root_cas_file: ${SPLUNK_CA_FILE}
