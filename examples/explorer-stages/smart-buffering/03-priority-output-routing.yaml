output:
  switch:
    cases:
      - check: this.priority_tier == 1
        output:
          http_client:
            url: ${DESTINATION_HTTPS_URL}
            batching:
              count: 1
              period: 0s
            tls:
              enabled: true
            headers:
              Authorization: Bearer ${DESTINATION_API_TOKEN}
            retries: 10
      - check: this.priority_tier == 2
        output:
          http_client:
            url: ${DESTINATION_HTTPS_URL}
            batching:
              count: 50
              period: 5s
            tls:
              enabled: true
            headers:
              Authorization: Bearer ${DESTINATION_API_TOKEN}
      - check: this.priority_tier == 3
        output:
          http_client:
            url: ${DESTINATION_HTTPS_URL}
            batching:
              count: 200
              period: 30s
            tls:
              enabled: true
            headers:
              Authorization: Bearer ${DESTINATION_API_TOKEN}
