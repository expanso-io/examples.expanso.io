output:
  switch:
    cases:
      - check: this._table == "orders"
        output:
          gcp_cloud_storage:
            bucket: ${GCS_BACKUP_BUCKET}
            path: backups/orders/${! meta("backup_date") }/orders-${!uuid_v4()}.parquet
            content_type: application/octet-stream
            batching:
              count: 10000
              period: 60s
              processors:
                - mapping: |
                    meta backup_date = this._backup_metadata.backup_date
                    root.record = this.format_json()
                - parquet_encode:
                    default_compression: snappy
                    schema:
                      - name: record
                        type: UTF8
      - check: this._table == "inventory"
        output:
          gcp_cloud_storage:
            bucket: ${GCS_BACKUP_BUCKET}
            path: backups/inventory/${! meta("backup_date")
              }/inventory-full-${!uuid_v4()}.parquet
            content_type: application/octet-stream
            batching:
              count: 50000
              period: 120s
              processors:
                - mapping: |
                    meta backup_date = this._backup_metadata.backup_date
                    root.record = this.format_json()
                - parquet_encode:
                    default_compression: snappy
                    schema:
                      - name: record
                        type: UTF8
      - check: this._table == "order_items"
        output:
          gcp_cloud_storage:
            bucket: ${GCS_BACKUP_BUCKET}
            path: backups/order_items/${! meta("backup_date") }/items-${!uuid_v4()}.parquet
            content_type: application/octet-stream
            batching:
              count: 10000
              period: 60s
              processors:
                - mapping: |
                    meta backup_date = this._backup_metadata.backup_date
                    root.record = this.format_json()
                - parquet_encode:
                    default_compression: snappy
                    schema:
                      - name: record
                        type: UTF8
      - output:
          gcp_cloud_storage:
            bucket: ${GCS_BACKUP_BUCKET}
            path: backups/unknown/${!this._table}/${!this._backup_metadata.backup_date}/data-${!timestamp_unix()}.json
            content_type: application/json
            batching:
              count: 1000
              period: 30s
