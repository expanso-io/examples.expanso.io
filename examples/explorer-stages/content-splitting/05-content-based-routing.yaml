pipeline:
  processors:
    - mapping: |
        meta device_id = this.device_id
        meta timestamp = this.timestamp
        meta location = this.location
        root = this
    - unarchive:
        format: json_array
        field: readings
    - mapping: |
        root = this
        root.device_id = meta("device_id")
        root.timestamp = meta("timestamp")
        root.location = meta("location")

        # Add alert classification
        root.alert_level = match {
          this.value >= 80 => "critical"
          this.value >= 75 => "warning"
          _ => "normal"
        }
output:
  switch:
    cases:
      - check: this.alert_level == "critical"
        output:
          http_client:
            url: ${ALERTS_HTTPS_URL}/critical
            verb: POST
            tls:
              enabled: true
            headers:
              Authorization: Bearer ${ALERT_SERVICE_TOKEN}
      - check: this.alert_level == "warning"
        output:
          kafka:
            topic: temperature-warnings
            addresses:
              - ${KAFKA_TLS_BROKERS}
            tls:
              enabled: true
              root_cas_file: ${KAFKA_CA_FILE}
            sasl:
              mechanism: SCRAM-SHA-512
              user: ${KAFKA_USERNAME}
              password: ${KAFKA_PASSWORD}
      - output:
          aws_s3:
            bucket: ${S3_BUCKET}
            region: ${AWS_REGION}
            path: normal/${! now().ts_format("2006-01-02") }/${! uuid_v4() }.json
            server_side_encryption: aws:kms
            kms_key_id: ${S3_KMS_KEY_ARN}
