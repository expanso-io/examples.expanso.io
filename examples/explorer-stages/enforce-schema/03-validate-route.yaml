pipeline:
  processors:
    - try:
        - json_schema:
            schema: '{"type": "object","required": ["sensor_id", "timestamp", "readings"],"properties": {"sensor_id": {"type": "string"},"timestamp": {"type": "string", "format": "date-time"},"readings": {"type": "object","required": ["temperature_celsius", "humidity_percent"],"properties": {"temperature_celsius": {"type": "number", "minimum": -50, "maximum": 100},"humidity_percent": {"type": "number", "minimum": 0, "maximum": 100}}}}}'
        - mapping: |
            root = this
            root.status = "valid"
    - catch:
        - mapping: |
            root = this
            root.status = "invalid"
            root.error = error()

output:
  switch:
    cases:
      - check: this.status == "valid"
        output:
          kafka:
            addresses: [localhost:9092]
            topic: sensor-data-valid

      - check: this.status == "invalid"
        output:
          kafka:
            addresses: [localhost:9092]
            topic: sensor-data-dlq
