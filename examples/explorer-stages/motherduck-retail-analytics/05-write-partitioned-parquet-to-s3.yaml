output:
  aws_s3:
    bucket: "${S3_BUCKET}"
    path: >-
      transactions/region=${! meta("store_region") }/date=${! now().ts_format("2006-01-02") }/batch_${! timestamp_unix() }_${! count("s3_files") }.parquet
    content_type: application/octet-stream
    server_side_encryption: aws:kms
    kms_key_id: '${S3_KMS_KEY_ARN}'
    max_in_flight: 4
