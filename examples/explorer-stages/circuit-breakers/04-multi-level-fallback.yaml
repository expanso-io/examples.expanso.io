output:
  fallback:
    - http_client:
        url: ${PRIMARY_HTTPS_URL}/process
        timeout: 5s
        tls:
          enabled: true
        headers:
          Authorization: Bearer ${DOWNSTREAM_API_TOKEN}
        retries: 2
    - http_client:
        url: ${SECONDARY_HTTPS_URL}/process
        timeout: 5s
        tls:
          enabled: true
        headers:
          Authorization: Bearer ${DOWNSTREAM_API_TOKEN}
        retries: 1
    - file:
        path: /var/buffer/failed-requests.jsonl
    - kafka:
        addresses:
          - ${KAFKA_TLS_BROKERS}
        topic: dlq-circuit-breaker-failures
        tls:
          enabled: true
          root_cas_file: ${KAFKA_CA_FILE}
        sasl:
          mechanism: SCRAM-SHA-512
          user: ${KAFKA_USERNAME}
          password: ${KAFKA_PASSWORD}
