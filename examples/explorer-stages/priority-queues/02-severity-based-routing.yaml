pipeline:
  processors:
    - mapping: |
        root = this

        # Map severity to priority
        root.priority = match root.severity {
          "CRITICAL" => "critical"
          "FATAL" => "critical"
          "ERROR" => "high"
          "WARNING" => "normal"
          "INFO" => "low"
          _ => "normal"
        }

        root.priority_score = match root.priority {
          "critical" => 85
          "high" => 60
          "normal" => 35
          "low" => 15
          _ => 0
        }
output:
  switch:
    cases:
      - check: this.priority == "critical"
        output:
          kafka:
            topic: logs-critical
            batching:
              count: 1
              period: 0s
            max_retries: 10
            addresses:
              - ${KAFKA_TLS_BROKERS}
            tls:
              enabled: true
              root_cas_file: ${KAFKA_CA_FILE}
            sasl:
              mechanism: SCRAM-SHA-512
              user: ${KAFKA_USERNAME}
              password: ${KAFKA_PASSWORD}
      - check: this.priority == "high"
        output:
          kafka:
            topic: logs-high
            batching:
              count: 10
              period: 1s
            addresses:
              - ${KAFKA_TLS_BROKERS}
            tls:
              enabled: true
              root_cas_file: ${KAFKA_CA_FILE}
            sasl:
              mechanism: SCRAM-SHA-512
              user: ${KAFKA_USERNAME}
              password: ${KAFKA_PASSWORD}
