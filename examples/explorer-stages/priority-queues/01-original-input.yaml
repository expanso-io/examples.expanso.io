output:
  kafka:
    addresses:
      - ${KAFKA_TLS_BROKERS}
    topic: all-events
    batching:
      count: 100
      period: 30s
    max_retries: 3
    tls:
      enabled: true
      root_cas_file: ${KAFKA_CA_FILE}
    sasl:
      mechanism: SCRAM-SHA-512
      user: ${KAFKA_USERNAME}
      password: ${KAFKA_PASSWORD}
