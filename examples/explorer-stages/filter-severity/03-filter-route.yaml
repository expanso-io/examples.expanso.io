pipeline:
  processors:
    - mapping: |
        root = this.parse_json()
        root.severity = this.level.uppercase()
        root.priority = match this.severity {
          "DEBUG" | "TRACE" => "low"
          "INFO" => "medium"
          "WARN" | "WARNING" => "high"
          "ERROR" | "CRITICAL" | "FATAL" => "critical"
          _ => "unknown"
        }
output:
  switch:
    cases:
      - check: this.priority == "low"
        output:
          drop: {}
      - check: this.priority == "critical" || this.priority == "high"
        output:
          http_client:
            url: ${ELASTICSEARCH_HTTPS_URL}/logs-critical/_doc/${! this.event_id.or(uuid_v4()) }
            verb: PUT
            headers:
              Authorization: ApiKey ${ELASTICSEARCH_API_KEY}
              Content-Type: application/json
            tls:
              enabled: true
              root_cas_file: ${ELASTICSEARCH_CA_FILE}
      - check: this.priority == "medium"
        output:
          aws_s3:
            bucket: ${S3_BUCKET}
            path: info/${!now().ts_unix()}.json
            region: ${AWS_REGION}
            server_side_encryption: aws:kms
            kms_key_id: ${S3_KMS_KEY_ARN}
