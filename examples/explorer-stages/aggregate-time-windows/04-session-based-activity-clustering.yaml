# Session-window preparation. A stateful session processor must consume these
# normalized keys and close a session after five minutes without activity.
pipeline:
  processors:
    - mapping: root = content().parse_json()
    - mapping: |
        root = this
        root.session_key = this.sensor_id.string()
        root.event_timestamp = this.timestamp.ts_parse("2006-01-02T15:04:05Z07:00")
        root.session_inactivity_threshold = "5m"
