# Production multi-level aggregation with reliability
input:
  kafka:
    addresses: [ "kafka-broker-1:9092", "kafka-broker-2:9092" ]
    topics: [ "sensor-events" ]
    consumer_group: "aggregation-pipeline"

rate_limit_resources:
  - label: input_limit
    local:
      count: 100000
      interval: 1s

pipeline:
  processors:
    - rate_limit:
        resource: input_limit
    - try:
        - mapping: |
            root = if !this.exists("sensor_id") {
              throw("Missing sensor_id")
            } else if this.temperature < -50 || this.temperature > 100 {
              throw("Temperature out of range")
            } else {
              this
            }
            root.processing_instance = "aggregation-instance-1"
    - catch:
        - log:
            level: WARN
            message: "validation failed: ${! error() }"
        - mapping: root = deleted()
    - archive:
        format: json_array
    - mapping: |-
        root = this.map_each(event -> [
          event.merge({"aggregation_type":"multi_level","aggregation_level":"sensor","group_key":event.sensor_id+"|sensor","window_duration_minutes":1}),
          event.merge({"aggregation_type":"multi_level","aggregation_level":"location","group_key":event.location+"|location","window_duration_minutes":1}),
          event.merge({"aggregation_type":"multi_level","aggregation_level":"global","group_key":"global","window_duration_minutes":1})
        ]).flatten()
    - unarchive:
        format: json_array
    - group_by_value:
        value: ${! this.group_key }
    - mapping: |-
        let events = json().from_all().sort_by(event -> event.timestamp)
        let first = $events.index(0)
        let values = $events.map_each(event -> event.temperature)
        let end = meta("window_end_timestamp").ts_parse("2006-01-02T15:04:05Z07:00").ts_unix_nano() / 1000000000
        let minute = 60
        root = if batch_index() == 0 {
          {"aggregation": {
            "aggregation_type": $first.aggregation_type,
            "aggregation_level": $first.aggregation_level,
            "group_key": $first.group_key,
            "sensor_id": $first.sensor_id,
            "location": $first.location,
            "window_start": ($end - $minute * $first.window_duration_minutes).ts_format("2006-01-02T15:04:05Z07:00"),
            "window_end": meta("window_end_timestamp"),
            "window_duration_minutes": $first.window_duration_minutes,
            "event_count": $events.length(),
            "temperature_avg": ($values.sum() / $values.length() * 100).round() / 100,
            "temperature_min": $values.min(),
            "temperature_max": $values.max(),
            "sensor_count": $events.map_each(event -> event.sensor_id).unique().length(),
            "location_count": $events.map_each(event -> event.location).unique().length()
          }}
        } else { deleted() }

output:
  fallback:
    - http_client:
        url: "https://analytics.company.com/aggregations"
        retries: 5
        batching:
          count: 500
          period: "10s"
    - file:
        path: "/var/buffer/aggregations.jsonl"
buffer:
  system_window:
    size: 1m
    timestamp_mapping: root = this.timestamp
