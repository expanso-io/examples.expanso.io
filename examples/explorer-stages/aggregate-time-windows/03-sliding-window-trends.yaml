# Sliding window aggregation (5-minute windows, 1-minute slides)
pipeline:
  processors:
    - mapping: root = content().parse_json()
    - group_by_value:
        value: '${! this.sensor_id }'
    - mapping: |-
        let events = json().from_all().sort_by(event -> event.timestamp)
        let first = $events.index(0)
        let temperatures = $events.map_each(event -> event.temperature)
        let first_temperature = $temperatures.index(0)
        let last_temperature = $temperatures.index($temperatures.length() - 1)
        root = if batch_index() == 0 {{
          "sensor_id": $first.sensor_id,
          "window_start": meta("window_start_timestamp"),
          "window_end": meta("window_end_timestamp"),
          "event_count": $events.length(),
          "temperature_5min_avg": $temperatures.sum() / $temperatures.length(),
          "temperature_slope": ($last_temperature - $first_temperature) / 5
        }} else { deleted() }

buffer:
  system_window:
    size: 5m
    slide: 1m
    timestamp_mapping: root = this.timestamp
