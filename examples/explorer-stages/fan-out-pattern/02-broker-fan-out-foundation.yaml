name: fan-out-foundation
type: pipeline

config:
  input:
    http_server:
      address: 0.0.0.0:8080
      path: /events

  output:
    broker:
      pattern: fan_out
      outputs:
        - file:
            path: /var/data/realtime.jsonl
        - file:
            path: /var/data/archive.jsonl
