pipeline:
  processors:
    - mapping: |
        root = this
        let key = env("PII_ENCRYPTION_KEY_HEX").decode("hex")
        let key = if $key.length() != 32 {
          throw("Expected a 32-byte AES key")
        } else { $key }
        let ssn_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
        let email_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
        let phone_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
        let birth_nonce = uuid_v4().replace_all("-", "").slice(0, 24)
        root.customer.ssn_encrypted = if this.customer.ssn != null {
          this.customer.ssn.encrypt_aes(
            "gcm", $key, $ssn_nonce.decode("hex")
          ).encode("base64")
        }
        root.customer.ssn_nonce = if this.customer.ssn != null {
          $ssn_nonce
        } else { deleted() }
        root.customer.ssn_last_four = if this.customer.ssn != null {
          this.customer.ssn.re_replace_all("[^0-9]", "").slice(-4)
        }
        root.customer.email_encrypted = if this.customer.email != null {
          this.customer.email.encrypt_aes(
            "gcm", $key, $email_nonce.decode("hex")
          ).encode("base64")
        }
        root.customer.email_nonce = if this.customer.email != null {
          $email_nonce
        } else { deleted() }
        root.customer.email_domain = if this.customer.email != null {
          this.customer.email.split("@").index(1).lowercase()
        }
        root.customer.phone_encrypted = if this.customer.phone != null {
          this.customer.phone.encrypt_aes(
            "gcm", $key, $phone_nonce.decode("hex")
          ).encode("base64")
        }
        root.customer.phone_nonce = if this.customer.phone != null {
          $phone_nonce
        } else { deleted() }
        let digits = if this.customer.phone != null {
          this.customer.phone.re_replace_all("[^0-9]", "")
        } else { "" }
        let national = if $digits.length() == 11 && $digits.has_prefix("1") {
          $digits.slice(1)
        } else { $digits }
        root.customer.phone_area_code = if this.customer.phone != null {
          $national.slice(0, 3)
        }
        root.customer.date_of_birth_encrypted = if this.customer.date_of_birth != null {
          this.customer.date_of_birth.encrypt_aes(
            "gcm", $key, $birth_nonce.decode("hex")
          ).encode("base64")
        }
        root.customer.date_of_birth_nonce = if this.customer.date_of_birth != null {
          $birth_nonce
        } else { deleted() }
        root.customer.birth_year = if this.customer.date_of_birth != null {
          this.customer.date_of_birth.split("-").index(0).number()
        }
        root.customer = root.customer.without("ssn", "email", "phone", "date_of_birth")
    - catch:
        - mapping: root = deleted()
