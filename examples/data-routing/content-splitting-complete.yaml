name: content-splitting-complete
type: pipeline
description: Complete Content Splitting Pipeline - Splits batch payloads (arrays, CSVs) into individual records for processing.
namespace: production
labels:
  category: data-routing
  pattern: content-splitting

config:
  input:
    http_server:
      address: '0.0.0.0:8080'
      path: /batch
      allowed_verbs: ['POST']

  pipeline:
    processors:
      # Step 1: Detect content type and validate
      - mapping: |
          root = this
          meta batch_id = uuid_v4()
          meta received_at = now()

      # Step 2: Extract items to split
      - mapping: |
          meta item_count = if this.items.type() == "array" {
            this.items.length()
          } else if this.records.type() == "array" {
            this.records.length()
          } else if this.type() == "array" {
            this.length()
          } else {
            1
          }
          root = if this.items.type() == "array" {
            this.items
          } else if this.records.type() == "array" {
            this.records
          } else if this.type() == "array" {
            this
          } else {
            [this]
          }

      # Step 3: Split array into individual messages
      - unarchive:
          format: json_array

      # Step 4: Enrich each item with batch context
      - mapping: |
          root = this
          root.batch_context = {
            "batch_id": meta("batch_id"),
            "received_at": meta("received_at"),
            "item_index": count("items"),
            "total_items": meta("item_count").number(),
            "split_at": now()
          }

      # Step 5: Validate individual items
      - mapping: |
          let is_valid = this.type() == "object" && this.keys().length() > 0

          root = if $is_valid {
            this
          } else {
            {"invalid": true, "original": this}
          }

          meta is_valid = $is_valid

  output:
    switch:
      cases:
        # Valid items → processing queue
        - check: 'meta("is_valid").bool()'
          output:
            kafka:
              addresses: ['${KAFKA_BROKERS:localhost:9092}']
              topic: processed-items
              batching:
                count: 100
                period: 5s

        # Invalid items → DLQ
        - output:
            file:
              path: "/var/expanso/dlq/${!timestamp_unix_date('2006-01-02')}/invalid-items.jsonl"
              codec: lines

logger:
  level: INFO
  format: json

metrics:
  prometheus:
    path: /metrics
