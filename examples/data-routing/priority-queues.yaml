name: severity-based-priority-queues
description: Route log messages to priority queues based on severity
type: pipeline
namespace: production

config:
  input:
    http_server:
      address: 0.0.0.0:8080
      path: /logs
      timeout: 5s
      rate_limit: http_ingest

  pipeline:
    processors:
      - mapping: root = content().parse_json()

      # Classify priority based on severity
      - mapping: |
          root = if this.severity == null {
            throw("Missing required field: severity")
          } else {
            this
          }

          # Normalize severity to uppercase
          root.severity = this.severity.string().uppercase()

          # Map severity to priority
          root.priority = match root.severity {
            "CRITICAL" => "critical"
            "FATAL" => "critical"
            "ERROR" => "high"
            "WARNING" => "normal"
            "WARN" => "normal"
            "INFO" => "low"
            "DEBUG" => "low"
            "TRACE" => "low"
            _ => "normal"
          }

          # Add priority score for metrics
          root.priority_score = match root.priority {
            "critical" => 100
            "high" => 75
            "normal" => 50
            "low" => 25
            _ => 0
          }

          root.processed_at = now()
          root.edge_node_id = env("NODE_ID").or("unknown")

  output:
    switch:
      retry_until_success: false

      cases:
        # Case 1: Critical priority - immediate delivery
        - check: this.priority == "critical"
          output:
            label: critical_queue
            kafka:
              addresses: ['${KAFKA_TLS_BROKERS}']
              topic: logs-critical
              tls: &kafka_tls
                enabled: true
                root_cas_file: ${KAFKA_CA_FILE}
              sasl: &kafka_sasl
                mechanism: SCRAM-SHA-512
                user: '${KAFKA_USERNAME}'
                password: '${KAFKA_PASSWORD}'

              # No batching - send immediately
              batching:
                count: 1
                period: 0s

              # Aggressive delivery guarantees
              max_in_flight: 1
              ack_replicas: true
              idempotent_write: true

              # Maximum retries for critical messages
              max_retries: 10
              backoff:
                initial_interval: 100ms
                max_interval: 2s

        # Case 2: High priority - small batches, fast delivery
        - check: this.priority == "high"
          output:
            label: high_priority_queue
            kafka:
              addresses: ['${KAFKA_TLS_BROKERS}']
              topic: logs-high
              tls: *kafka_tls
              sasl: *kafka_sasl

              # Small batches for fast delivery
              batching:
                count: 10
                period: 1s

              # Strong delivery guarantees
              max_in_flight: 5
              ack_replicas: true

              # Moderate retries
              max_retries: 5
              backoff:
                initial_interval: 500ms
                max_interval: 5s

              compression: snappy

        # Case 3: Normal priority - standard batching
        - check: this.priority == "normal"
          output:
            label: normal_queue
            kafka:
              addresses: ['${KAFKA_TLS_BROKERS}']
              topic: logs-normal
              tls: *kafka_tls
              sasl: *kafka_sasl

              # Standard batching for balanced throughput/latency
              batching:
                count: 100
                period: 5s

              # Balanced configuration
              max_in_flight: 10

              # Standard retries
              max_retries: 3
              backoff:
                initial_interval: 1s
                max_interval: 10s

              compression: snappy

        # Case 4: Low priority - large batches, deferred delivery
        - check: this.priority == "low"
          output:
            label: low_priority_queue
            kafka:
              addresses: ['${KAFKA_TLS_BROKERS}']
              topic: logs-low
              tls: *kafka_tls
              sasl: *kafka_sasl

              # Large batches to minimize overhead
              batching:
                count: 1000
                period: 1m

              # High concurrency for throughput
              max_in_flight: 20

              # Minimal retries
              max_retries: 1
              backoff:
                initial_interval: 5s
                max_interval: 30s

              # Aggressive compression for low-priority bulk data
              compression: gzip

        # Default: Treat unknown priorities as normal
        - output:
            kafka:
              addresses: ['${KAFKA_TLS_BROKERS}']
              topic: logs-normal
              tls: *kafka_tls
              sasl: *kafka_sasl
              batching:
                count: 100
                period: 5s
  rate_limit_resources:
    - label: http_ingest
      local:
        count: 10000
        interval: 1s
