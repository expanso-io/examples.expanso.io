# Cluster-scoped, applied once by a cluster-admin. Enables OpenShift
# user-workload monitoring so the ServiceMonitor in oran-telemetry is scraped.
#
# If openshift-monitoring/cluster-monitoring-config already exists, merge the
# enableUserWorkload line into it instead of applying this file:
#
#   oc -n openshift-monitoring get configmap cluster-monitoring-config -o yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: true
