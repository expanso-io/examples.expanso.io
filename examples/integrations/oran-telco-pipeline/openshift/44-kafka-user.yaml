# SCRAM-SHA-512 producer identity for the edge agent. The User Operator creates
# Secret expanso-oran with a `password` key, which the Deployment reads into
# KAFKA_PASSWORD. The username is the resource name.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: expanso-oran
  namespace: oran-telemetry
  labels:
    strimzi.io/cluster: oran-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: oran-telemetry-structured
          patternType: literal
        operations: [Write, Describe]
        host: '*'
      - resource:
          type: topic
          name: oran-telemetry-alerts
          patternType: literal
        operations: [Write, Describe]
        host: '*'
