apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: cloudera-consumer
  namespace: oran-telemetry
  labels:
    strimzi.io/cluster: oran-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: oran-telemetry-structured
          patternType: literal
        operations: [Read, Describe]
        host: '*'
      - resource:
          type: topic
          name: oran-telemetry-alerts
          patternType: literal
        operations: [Read, Describe]
        host: '*'
      - resource:
          type: group
          name: cloudera-oran-telemetry
          patternType: literal
        operations: [Read, Describe]
        host: '*'
