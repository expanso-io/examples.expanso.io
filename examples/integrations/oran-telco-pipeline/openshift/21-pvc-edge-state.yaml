# Agent state: node identity and credentials from bootstrap, local job state.
# Keeping this on a claim means a pod restart does not re-register the node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: expanso-edge-state
  namespace: oran-telemetry
  labels:
    app.kubernetes.io/part-of: oran-telco-pipeline
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
