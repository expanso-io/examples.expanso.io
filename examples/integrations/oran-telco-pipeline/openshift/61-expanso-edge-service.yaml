# In-cluster endpoint for the DU exporter to POST telemetry to the pipeline's
# http_server input (/telemetry).
apiVersion: v1
kind: Service
metadata:
  name: expanso-edge
  namespace: oran-telemetry
  labels:
    app.kubernetes.io/name: expanso-edge
    app.kubernetes.io/part-of: oran-telco-pipeline
spec:
  selector:
    app.kubernetes.io/name: expanso-edge
  ports:
    - name: telemetry
      port: 8080
      targetPort: telemetry
