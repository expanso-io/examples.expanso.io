# Parquet output, dead-letter files, and anything else the pipeline writes
# under /data. Uses the cluster's default StorageClass; on SNO that is usually
# the LVM Storage operator class (lvms-vg1). Set storageClassName explicitly
# if the node has more than one class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oran-telemetry-data
  namespace: oran-telemetry
  labels:
    app.kubernetes.io/part-of: oran-telco-pipeline
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
