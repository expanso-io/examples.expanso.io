# Every structured telemetry record (static/pipelines/oran-telco-pipeline.yaml).
# Cloudera, or any downstream consumer, reads it over the same TLS listener
# with its own KafkaUser.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: oran-telemetry-structured
  namespace: oran-telemetry
  labels:
    strimzi.io/cluster: oran-kafka
spec:
  partitions: 12
  replicas: 1
  config:
    retention.ms: 604800000 # 7 days
    compression.type: producer
