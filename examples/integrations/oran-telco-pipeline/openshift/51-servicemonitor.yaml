# Hands the collector's Prometheus exporter to OpenShift user-workload
# monitoring. Requires enableUserWorkload: true in the cluster monitoring
# config (cluster/user-workload-monitoring.yaml). Once scraped, the oran_*
# series are queryable from the Observe > Metrics page and from Thanos Querier.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: oran-collector
  namespace: oran-telemetry
  labels:
    app.kubernetes.io/part-of: oran-telco-pipeline
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: oran-collector
      operator.opentelemetry.io/collector-service-type: base
  endpoints:
    - port: prometheus
      interval: 30s
      scrapeTimeout: 10s
