pipeline:
  processors:
    - mapping: |
        # Parse syslog timestamp and message structure
        let raw = content().string()
        let parts = $raw.re_find_all_submatch(
          "^(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}) \\[(INFO|WARN|ERROR|DEBUG)\\] \\[([^\\]]+)\\] (.+)$"
        )
        root = if $parts.length() > 0 {
          {
            "timestamp": $parts.index(0).index(1),
            "level": $parts.index(0).index(2),
            "thread": $parts.index(0).index(3),
            "message": $parts.index(0).index(4),
            "raw": $raw
          }
        } else {
          {
            "timestamp": now(),
            "level": "INFO",
            "thread": "unknown",
            "message": $raw,
            "raw": $raw
          }
        }
