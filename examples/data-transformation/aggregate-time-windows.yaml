config:
  input:
    http_server:
      address: '0.0.0.0:8080'
      path: /sensors/readings

  pipeline:
    processors:
      # Parse JSON input
      - mapping: root = content().parse_json()
      # Assign time bucket (round to minute)
      - mapping: |
          root = this
          let minute_start = (this.timestamp.ts_parse("2006-01-02T15:04:05Z07:00").ts_unix() / 60).floor() * 60
          root.time_bucket = $minute_start.ts_format("2006-01-02T15:04:05Z07:00")
          root.group_key = this.sensor_id + "|" + root.time_bucket

      # Emit a summary for the event's one-minute window. Downstream output
      # batching combines summaries efficiently without external state.
      - mapping: |
          root.sensor_id = this.sensor_id
          root.time_bucket = this.time_bucket
          root.window_start = this.time_bucket
          root.window_end = (this.time_bucket.ts_parse("2006-01-02T15:04:05Z07:00").ts_unix() + 60).ts_format("2006-01-02T15:04:05Z07:00")
          root.event_count = 1
          root.temperature_avg = this.temperature
          root.temperature_min = this.temperature
          root.temperature_max = this.temperature

  output:
    http_client:
      url: '${ANALYTICS_ENDPOINT}/metrics/aggregated'
      verb: POST
      batching:
        count: 50
        period: 10s
