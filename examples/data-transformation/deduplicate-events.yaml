config:
  cache_resources:
    - label: dedup_cache
      memory:
        default_ttl: 1h

  input:
    http_server:
      address: '0.0.0.0:8080'
      path: /webhooks/signup

  pipeline:
    processors:
      # Parse JSON
      - mapping: root = content().parse_json()
      # Generate content hash
      - mapping: |
          root = this
          # json_format() ensures stable key ordering
          let event_json = this.format_json()
          root.dedup_hash = $event_json.hash("sha256")
          root.dedup_timestamp = now()

      # Mark the result before duplicates are filtered.
      - mapping: |
          root = this
          root.dedup_result = {
            "is_duplicate": false,
            "dedup_hash": this.dedup_hash,
            "checked_at": now(),
            "strategy": "hash-based"
          }

      # Store hashes in the local cache and drop messages seen before.
      - dedupe:
          cache: dedup_cache
          key: '${!json("dedup_hash")}'

  output:
    http_client:
      url: '${ANALYTICS_ENDPOINT}/events'
      verb: POST
