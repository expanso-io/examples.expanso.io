name: format-negotiation-and-avro
type: pipeline
config:
  input:
    broker:
      inputs:
        - http_server:
            address: ""
            path: /sensors/ingest
            allowed_verbs:
              - POST
            sync_response:
              headers:
                Content-Type: ${! meta("response_type") }
        - http_server:
            address: ""
            path: /transform
            allowed_verbs:
              - POST
            sync_response:
              headers:
                Content-Type: ${! meta("response_type") }
  pipeline:
    processors:
      - command:
          name: uv
          args_mapping: root = ["run", "--no-project", env("RECORD_CODECS_SCRIPT"), "decode"]
      - catch:
          - mapping: root = deleted()
  output:
    broker:
      pattern: fan_out
      outputs:
        - processors:
            - command:
                name: uv
                args_mapping: root = ["run", "--no-project", env("RECORD_CODECS_SCRIPT"), "encode", meta("Accept").or("application/json")]
            - mapping: |-
                meta response_type = match this.transformation.target_format { "xml" => "application/xml", "csv" => "text/csv", _ => "application/json" }
                root = this.data
          sync_response: {}
        - switch:
            cases:
              - check: this.data.sensor_id != null && this.data.metadata != null
                output:
                  kafka:
                    addresses:
                      - ${KAFKA_TLS_BROKERS}
                    topic: sensor-readings-avro
                    tls:
                      enabled: true
                      root_cas_file: ${KAFKA_CA_FILE}
                    sasl:
                      mechanism: SCRAM-SHA-512
                      user: ${KAFKA_USERNAME}
                      password: ${KAFKA_PASSWORD}
                    compression: snappy
                    batching:
                      count: 100
                      period: 5s
                  processors:
                    - mapping: root = this.data
                    - mapping: |
                        root.sensor_id = this.sensor_id
                        root.location = this.location
                        root.temperature = this.temperature
                        root.humidity = this.humidity
                        root.timestamp = this.timestamp
                        root.device_type = this.metadata.device_type
                        root.firmware_version = this.metadata.firmware_version
                    - command:
                        name: uv
                        args_mapping: root = ["run", "--no-project", env("RECORD_CODECS_SCRIPT"), "avro"]
                    - mapping: root = this.avro_base64.decode("base64")
              - output:
                  drop: {}
  http:
    enabled: true
    address: 127.0.0.1:8080
    root_path: /runtime
    debug_endpoints: false
