name: aggregate-time-windows-complete
type: pipeline
description: Complete time-windowed aggregation example with tumbling, sliding, and multi-level aggregation patterns.
namespace: production
labels:
  category: data-transformation
  pattern: time-windows

config:
  input:
    kafka:
      addresses:
        - '${KAFKA_BROKER_1:kafka-1:9092}'
        - '${KAFKA_BROKER_2:kafka-2:9092}'
      topics: [ 'sensor-events' ]
      consumer_group: 'time-window-aggregation-${INSTANCE_ID:default}'

  pipeline:
    processors:
      - try:
          - mapping: |
              root = if !this.exists("sensor_id") {
                throw("Missing required field: sensor_id")
              } else if !this.exists("timestamp") {
                throw("Missing required field: timestamp")
              } else if !this.exists("temperature") {
                throw("Missing required field: temperature")
              } else {
                this
              }
              root.processing_started_at = now().ts_format("2006-01-02T15:04:05.000Z")
              root.pipeline_instance = "${INSTANCE_ID:default}"
              root.location = this.location.or("unknown_location")
              root.facility = this.facility.or("unknown_facility")
      - catch:
          - log:
              level: WARN
              message: "input validation failed: ${! error() }"
          - mapping: root = deleted()
      - archive:
          format: json_array
      - mapping: |-
          let end = meta("window_end_timestamp").ts_parse("2006-01-02T15:04:05Z07:00").ts_unix_nano() / 1000000000
          let minute = 60
          root = this.map_each(event -> [
            event.merge({"aggregation_type":"sliding","group_key":event.sensor_id+"|sliding","window_duration_minutes":5}),
            if event.timestamp.ts_parse("2006-01-02T15:04:05Z07:00").ts_unix_nano() / 1000000000 >= $end - $minute { event.merge({"aggregation_type":"tumbling","group_key":event.sensor_id+"|tumbling","window_duration_minutes":1}) },
            if event.timestamp.ts_parse("2006-01-02T15:04:05Z07:00").ts_unix_nano() / 1000000000 >= $end - $minute { event.merge({"aggregation_type":"multi_level","aggregation_level":"sensor","group_key":event.sensor_id+"|sensor","window_duration_minutes":1}) },
            if event.timestamp.ts_parse("2006-01-02T15:04:05Z07:00").ts_unix_nano() / 1000000000 >= $end - $minute { event.merge({"aggregation_type":"multi_level","aggregation_level":"location","group_key":event.location+"|location","window_duration_minutes":1}) }
          ]).flatten().filter(event -> event != null)
      - unarchive:
          format: json_array
      - group_by_value:
          value: ${! this.group_key }
      - mapping: |-
          let events = json().from_all().sort_by(event -> event.timestamp)
          let first = $events.index(0)
          let values = $events.map_each(event -> event.temperature)
          let end = meta("window_end_timestamp").ts_parse("2006-01-02T15:04:05Z07:00").ts_unix_nano() / 1000000000
          let minute = 60
          root = if batch_index() == 0 {
            {"aggregation": {
              "aggregation_type": $first.aggregation_type,
              "aggregation_level": $first.aggregation_level,
              "group_key": $first.group_key,
              "sensor_id": $first.sensor_id,
              "location": $first.location,
              "window_start": ($end - $minute * $first.window_duration_minutes).ts_format("2006-01-02T15:04:05Z07:00"),
              "window_end": meta("window_end_timestamp"),
              "window_duration_minutes": $first.window_duration_minutes,
              "event_count": $events.length(),
              "temperature_avg": ($values.sum() / $values.length() * 100).round() / 100,
              "temperature_min": $values.min(),
              "temperature_max": $values.max(),
              "sensor_count": $events.map_each(event -> event.sensor_id).unique().length(),
              "location_count": $events.map_each(event -> event.location).unique().length()
            }}
          } else { deleted() }

  output:
    broker:
      pattern: fan_out
      outputs:
        - http_client:
            url: '${ANALYTICS_ENDPOINT:http://localhost:8080}/aggregations'
            verb: POST
            headers:
              Content-Type: application/json
            batching:
              count: 500
              period: '10s'
            timeout: '15s'
            retries: 2

        - file:
            path: '/var/expanso/buffer/aggregations-${!timestamp_unix()}.jsonl'
            codec: lines
  buffer:
    system_window:
      size: 5m
      slide: 1m
      timestamp_mapping: root = this.timestamp

logger:
  level: '${LOG_LEVEL:INFO}'
  format: json

metrics:
  prometheus:
    path: '/metrics'
