# Hash-based deduplication processor
cache_resources:
  - label: dedup_cache
    memory:
      default_ttl: 1h

pipeline:
  processors:
    - mapping: |
        root = this
        # Generate SHA-256 hash of entire content
        root.dedup_hash = this.format_json().hash("sha256")

    - branch:
        request_map: root = this.dedup_hash
        processors:
          - cache:
              resource: dedup_cache
              operator: exists
              key: '${! content() }'
        result_map: root.is_duplicate = content().string().bool()

    - switch:
        - check: '!this.is_duplicate'
          processors:
            - cache:
                resource: dedup_cache
                operator: set
                key: '${! json("dedup_hash") }'
                value: '${! now() }'
        - processors:
            - mapping: root = deleted()
