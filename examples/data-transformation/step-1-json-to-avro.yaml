pipeline:
  processors:
    - mapping: |
        root.sensor_id = this.sensor_id.string()
        root.temperature_celsius = this.temperature_celsius.number()
        root.humidity_percent = this.humidity_percent.number()
        root.timestamp = this.timestamp.string()
    # Expanso Edge delegates Avro binary encoding to the selected encoder.
    - subprocess:
        name: node
        args:
          - -e
          - |-
            process.stdin.pipe(process.stdout)
        codec_send: lines
        codec_recv: lines
