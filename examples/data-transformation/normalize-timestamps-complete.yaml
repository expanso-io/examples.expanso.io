name: timestamp-normalization
description: Normalize timestamps to UTC with enrichment
type: pipeline
namespace: default
labels:
  category: data-transformation
  pattern: timestamp-normalization

config:
  input:
    broker:
      inputs:
        - http_server:
            address: '127.0.0.1:8080'
            path: /events/ingest
            allowed_verbs: [POST]
            timeout: 10s
        - kafka:
            addresses: ['${KAFKA_TLS_BROKERS}']
            topics: ['${INPUT_TOPIC:-raw-events}']
            consumer_group: timestamp-normalizer
            start_from_oldest: false
            tls:
              enabled: true
              root_cas_file: ${KAFKA_CA_FILE}
            sasl:
              mechanism: SCRAM-SHA-512
              user: '${KAFKA_USERNAME}'
              password: '${KAFKA_PASSWORD}'

  pipeline:
    processors:
      # Validate required fields
      - mapping: |
          root = if this.event_id != null && this.event_type != null {
            this
          } else {
            throw("Missing required fields: event_id or event_type")
          }

      # Store original timestamp
      - mapping: |
          root = this
          root.timestamp_original = this.timestamp

      # Detect format and parse
      - mapping: |
          root = this
          let ts = this.timestamp

          # Parse based on type and format
          root.parsed_timestamp = if $ts.type() == "number" {
            # Unix timestamp (detect seconds vs milliseconds)
            if $ts > 10000000000 { ($ts / 1000).floor() } else { $ts }
          } else if $ts.type() == "string" {
            # ISO8601 with timezone
            if $ts.contains("T") && ($ts.contains("Z") || $ts.re_match("[+-][0-9]{2}:[0-9]{2}$")) {
              $ts.ts_parse("2006-01-02T15:04:05Z07:00").ts_unix()
            # ISO8601 without timezone
            } else if $ts.contains("T") {
              ($ts + "Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_unix()
            # US format MM/DD/YYYY
            } else if $ts.contains("/") {
              ($ts + " UTC").ts_parse("01/02/2006 15:04:05 MST").ts_unix()
            # SQL format YYYY-MM-DD HH:mm:ss
            } else if $ts.contains("-") && $ts.contains(":") && $ts.contains(" ") {
              if this.timezone != null && this.timezone.re_match("^[+-][0-9]{2}:[0-9]{2}$") {
                ($ts + this.timezone).ts_parse("2006-01-02 15:04:05Z07:00").ts_unix()
              } else {
                ($ts + " UTC").ts_parse("2006-01-02 15:04:05 MST").ts_unix()
              }
            # Compact YYYYMMDD
            } else if $ts.length() == 8 && !$ts.contains(":") {
              $ts.ts_parse("20060102").ts_unix()
            # Compact YYYYMMDDHHmmss
            } else if $ts.length() == 14 && !$ts.contains(":") {
              $ts.ts_parse("20060102150405").ts_unix()
            } else {
              throw("Unsupported timestamp format: " + $ts)
            }
          } else {
            throw("Timestamp must be string or number")
          }

      # Validate timestamp range
      - mapping: |
          root = this
          let now_ts = now()
          let event_ts = this.parsed_timestamp
          let diff_seconds = $event_ts - $now_ts.ts_unix()

          # Allow 1 hour future (clock skew), 30 days past (delayed data)
          root = if $diff_seconds > 3600 {
            throw("Timestamp too far in future: " + $diff_seconds.string() + " seconds")
          } else if $diff_seconds < -2592000 {
            throw("Timestamp too old: " + ($diff_seconds * -1).string() + " seconds")
          } else {
            this
          }

      # Standardize to ISO8601 UTC
      - mapping: |
          root = this
          root.timestamp = this.parsed_timestamp.ts_format("2006-01-02T15:04:05Z07:00", "UTC")
          root = root.without("parsed_timestamp")

      # Add time metadata
      - mapping: |
          root = this
          let ts = this.timestamp.ts_parse("2006-01-02T15:04:05Z07:00")
          let day_of_week = $ts.ts_format("Mon", "UTC")
          let is_weekend = $day_of_week == "Sat" || $day_of_week == "Sun"
          let hour = $ts.ts_format("15", "UTC").number()

          root.time_metadata = {
            "year": $ts.ts_format("2006", "UTC"),
            "month": $ts.ts_format("01", "UTC"),
            "day": $ts.ts_format("02", "UTC"),
            "hour": $ts.ts_format("15", "UTC"),
            "minute": $ts.ts_format("04", "UTC"),
            "day_of_week": $day_of_week,
            "quarter": if $ts.ts_format("01", "UTC").number() <= 3 {
              "Q1"
            } else if $ts.ts_format("01", "UTC").number() <= 6 {
              "Q2"
            } else if $ts.ts_format("01", "UTC").number() <= 9 {
              "Q3"
            } else {
              "Q4"
            },
            "is_business_hours": !$is_weekend && $hour >= 9 && $hour < 17,
            "is_weekend": $is_weekend,
            "hour_bucket": $ts.ts_format("2006-01-02T15", "UTC") + ":00:00Z",
            "day_bucket": $ts.ts_format("2006-01-02", "UTC"),
            "unix": $ts.ts_unix(),
            "unix_milli": $ts.ts_unix_milli(),
            "normalized_at": now().ts_format("2006-01-02T15:04:05Z07:00", "UTC"),
            "node_id": env("NODE_ID").or("unknown")
          }

      # Preserve original timezone info
      - mapping: |
          root = this
          root.original_timezone = if this.timezone != null {
            this.timezone
          } else if this.timestamp_original.type() == "string" && this.timestamp_original.contains("+") {
            this.timestamp_original.re_find_all("([+-][0-9]{2}:[0-9]{2})$").index(0).or("UTC")
          } else if this.timestamp_original.type() == "string" && this.timestamp_original.contains("Z") {
            "UTC"
          } else {
            "unknown"
          }
          root = root.without("timezone")

      # Add processing metadata
      - mapping: |
          root = this
          root.processed_at = now().ts_format("2006-01-02T15:04:05Z07:00", "UTC")
          let event_time = this.timestamp.ts_parse("2006-01-02T15:04:05Z07:00").ts_unix()
          let process_time = now().ts_unix()
          root.processing_latency_ms = (process_time - event_time) * 1000

      # Preserve the prior data-quality contract while keeping validation
      # details internal to the pipeline.
      - mapping: |
          root = this
          root.validation = {
            "timestamp_exists": this.timestamp.type() == "string",
            "utc_format": this.timestamp.has_suffix("Z"),
            "original_preserved": this.timestamp_original != null
          }
          let checks = root.validation.values()
          root.quality_score = $checks.map_each(value -> if value { 1 } else { 0 }).sum() / $checks.length()
          root = root.without("validation")

  output:
    broker:
      pattern: fan_out
      outputs:
        # Time-series database
        - http_client:
            url: '${TIMESERIES_HTTPS_URL}/write'
            verb: POST
            headers:
              Authorization: 'Bearer ${TIMESERIES_API_TOKEN}'
            batching:
              count: 500
              period: 10s
            tls:
              enabled: true

        # Analytics
        - kafka:
            addresses: ['${KAFKA_TLS_BROKERS}']
            topic: '${OUTPUT_TOPIC:-normalized-timestamps}'
            key: '${! this.event_id }'
            tls:
              enabled: true
              root_cas_file: ${KAFKA_CA_FILE}
            sasl:
              mechanism: SCRAM-SHA-512
              user: '${KAFKA_USERNAME}'
              password: '${KAFKA_PASSWORD}'
            compression: gzip
            batching:
              count: 100
              period: 5s

        # DLQ for failures
        - switch:
            cases:
              - check: errored()
                output:
                  file:
                    path: '${TIMESTAMP_DLQ_PATH}/timestamp-dlq.jsonl'
                    codec: lines
              - output:
                  drop: {}

metrics:
  prometheus:
    path: /metrics
